s7V0eWkdPbPzd3rxkTGybadYySumVzhcaJFbs5UrEkQ/+CK8gF5dnh/6ciIZ73gwQ927L1IitoxKLXYP3SjYdOrHHfTZhRRlFyrorafPk20B3HPD1y2G3qKZME5Jcf3t/HUC13/8tSd++vqFveMUTwAUxSUFI1QekR1+bIze3D9MF2aq6cPvG72CgnldWCFqyRw3lwH8ZMerjTD9ElRO7Gv44wNpC90aASqGfVlz/Rx17srQ57/UU26hkhQqUB7dBR71WmzQhHUnblGmVOEw0jhbV1n9OlXUDCIRGaNV5Jp43N516fN7JmnTHdfp7Hgy0luO4aMhtkLL8Bi3bUWYvzh5Mn1dTxrL6QmGuRhGL/TiTTxRoEdTszSaq9GR0NGA3KdkOz3hqSV3MIDhQ5IVX/Ivx3umBti2es2h4eZby7x8br1rkf7Mo90AqC8aQ3sJeNzqFRu+vSANAQe3PL7l0HGOAdwDCeZYvNKeoZp1Qfs6Aipndh86HmFRi0LAnEO47wsqM6cdfjh3jBPUzhZy7nvlUfFsamED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">反将<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>在蜀地附近修炼的小妖精们这两日又遭了殃，原因无怪乎是前些日子里真君与夫人又因为点子小事发生了口角，两位气性高的主儿谁也不让谁，奈何三公主娇贵，打不得骂不得，真君老爷只好憋着一口气来这山野里撒。梅山兄弟晓得了杨二爷这心情不爽的缘由，想来是这回气得狠了，兄弟几个宽慰劝导无果也就陪着在山中操练。约莫过了五六日，突然有驻守灌江口的草头神来报：夫人在家中身体不适。</p> <p>原本正擦拭着三尖两刃刀的杨戬听得此言，手中帕子一落，未待众人反应过来，屋内便不见了他的身影。此刻便是纵地金光术也叫杨戬嫌慢，只怨自己离家太远不能立刻赶回寸心跟前。</p> <p>待他风尘仆仆进了家门，打眼望去正厅里没个人影儿，心下急躁三步并作两步往厢房拐去。此刻真君是心急如焚，挂念着妻子娇气怕痛，平时更少见她身体不适，这回抱恙肯定将人折腾坏了。</p> <p>甫一出前厅，隐约听得后院有水声，“莫非是身子不爽利幻作了原身？”杨戬三两步上前，却看那龙女此刻背对着他浸在池子里，小手掬起一捧水往身上淋。许是太热着了暑气，他这番想着上前，却看敖寸心微微一震随即转过身来，秀眉微蹙仿佛难受的紧。杨戬伸手去捞她，龙女便顺势卸力靠他撑着自己，“你回来了？不生气了嘛？”平日里精神十足的语气此刻也变得虚弱无力，看得杨戬好不心疼，抿嘴点点头便想将龙女从池子里抱出来。</p> <p>谁知这公主旋身一动便从他臂弯里滑了出去，动作敏捷全然不像身体不适。杨戬正纳闷，瞧见敖寸心眼神有些飘忽不定，“你，你先回房吧，我自己在这泡一会儿。”</p> <p>此刻他心下了然，龙女回回心虚便是这副模样，想来身体抱恙不过是哄他回家的托辞。再看寸心身上披着的鲛纱映着粼粼水光，包裹着她玲珑有致的身躯，蜀地的热气仿佛蒸腾到了他身上。杨戬轻咳一声，煞有介事道：“你身体不适，我不放心，还是在这陪你吧。”说罢幻去了一身甲胄，只着中衣进了水里。</p> <p>敖寸心心虚，只能顺着他的意被搂进怀里。谁料这人手脚不老实，在她腰间煽风点火，三两下就叫她软了身子，这会子再开口倒是真的娇弱无力，“嗯…杨戬你别…”</p> <p>“别什么？”他侧头含住龙女小巧的耳珠，“你不舒服，我给你揉揉。”</p> <p>敖寸心按住他作乱的手，“别，我…我现在好多了，不用揉了。”</p> <p>“哦？既然如此，那就请公主替我治治吧。”</p> <p>龙女茫然：“治什么？”</p> <p>杨戬拉过她的手向下探去，鼻息铺在她颈间，“治治它。”他握着龙女的纤手在那灼热上来来回回，上头也不闲着，牙齿轻咬将那胸前丝绦解开，另一手便顺势抚上龙女胸前挺翘揉捏。</p> <p>吸咬了好一会儿才放过浑身酥软的寸心，一手搂着她腰一手按着她臀将自己缓缓压进去。</p> <p>杨戬靠在池边，腰胯颠动着身前的龙女，寸心娇气地扶在他身上，语气粘腻娇嗔：“臭杨戬，一点不晓得心疼我。”他瞧着阳光透过树影落在龙女肩头，随着他的频率闪烁，轻笑道：“这不正在疼你。”​​​​</p></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/ALLforJianXin/allforjianxin.github.io/edit/master/docs/87.短篇-2021/040200.反将.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=%E7%9F%AD%E7%AF%87" title="标签">#短篇</a><a href="/tags/?tag=%E5%BE%97%E5%AF%B8%E8%BF%9B%E5%B0%BA" title="标签">#得寸进尺</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/07, 20:39:53</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/4403f3/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">记第三十七次拉回坠入爱河的老婆</div></a> <a href="/pages/9ce580/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">清明</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
