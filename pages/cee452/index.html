小玉出生时间很凑巧，西游刚开始。三界众生没拿剧本，在他们看来，西游是什么？金蝉子转世唐朝，去西天求取真经，灵山和天廷，两边大佬都卷入其中，在天上筹划，凡间呢，帝王为事端，有人做前锋，有人做保镖，有人当路障。三界众人面对这局面……乍一看似曾相识，仔细想胆战心惊，这套路好熟悉啊，上一次这么搞事还是封神时期。大家对这个阵势仔细琢磨，封神开始的时候，估计都以为是意思意思走流程，虽然截教阐教两边大佬都让徒弟们紧闭洞门好好宅着，偏偏有头铁的、有不信邪的、有各种理由的，都往山下跑，导致封神成了神仙版绞肉机，连通天这个等级都卷进去了，那么西游呢？是让神仙们下凡镀个金再消遣一下，还是再一次大清洗？三界众人在最初都不敢轻易掺和。<br>
杨戬视角看来，西游是封神之后的又一次三界动荡，又是一次两边大佬都卷进去的漩涡，若想保全自身的肯定是能避就避，八十一难没结束前，大家都不知道是走形式还是真劫难。封神时期，杨戬哪吒做为西岐阵营知名外挂，他们的败仗屈指可数，可三霄的黄河阵就是其中之一。杨戬栽了这么大的跟头，绝对会吃一堑长一智，而双方阵营中，像三霄这样的人太多了，开始时都很清醒闭门谢客，后来没忍住下山，于是都玩完了，纷纷给封神榜送了人头。<br>
杨戬对于这个局面，已经进入战斗状态，外松内紧。战斗状态的杨戬是什么样？殷商阵营的人、尤其是化血神刀主人余化、渑池高兰英张奎都能斩钉截铁地说“杨戬战斗时有智力、有武力、没有任何道德压力”，那么偶遇唐僧的杨戬在听到他自爆吃了他的肉就可以长生不老，会是什么反应？一是金蝉子转世，武力没了，智力也没了，二是金蝉子有恃无恐才这么做，三是他在钓鱼。<br>
偏偏这时，小玉出生了，她的出生和这次事件有千丝万缕的关系，她父亲五哥要对唐僧不利，她的母亲狐妹因此而死，狐妹五哥都是杨戬杨婵治水时期的旧识，引起风波的劈天神掌更是玉鼎所授。这一切都指向西游，杨家卷入此事似乎已经不可避免，又在这时，杨婵收养了这个女婴。这和封神最初时，各路仙家卷入商周大战的套路太像了。</p> <p>杨戬如果还是灌江口治水时期的杨戬，可能不会想太多，硬刚就对了，可他做为封神之战后肉身成圣的幸存者，如果他一点长进没有，那么打个比方旧识他的身体往前走了一千多年，脑袋还停留在原地。对杨戬这种在战争中成长的天才来说，明显是不可能的，他会思考这是不是一个针对杨家的阴谋，毕竟一千多年来，玉帝的威胁还悬在头上，他的妹妹杨婵、他的妻子寸心、他的岳家西海，都在天条阴影的笼罩下。如果他在西游中遭遇不测，那么很可能是家破人亡、身死道消。<br>
剧外观众都知道，西游其实没有封神那么凶险，万窟山并不算八十一难，五哥更是毫无姓名。他原本可以不参与，但是主动蹚浑水了还进不去八十一难，说明劫难就是有安排的，而不是看见唐僧跳出来拦路就算一个。可是杨戬没有剧透，从他的视角只能看到小玉和西游事件的瓜葛太多了，留在杨婵身边很可能成为导火索，三霄当初那么清醒，不也是为了赵公明蹚浑水，最后被一起带走了。<br>
对于这个局面，杨戬做出的行为是抱走小玉，他的理由很多，杨婵一个单身女性抚养孩子恐怕有人说闲话、他带回去和寸心缓和关系、等她长大了再送回来，实际上，这是政治风险转移。<br>
杨戬带走小玉，自然是有底气。他成亲当日有元始天尊天尊降下法旨，表面上看是指示封神之事，实际上，他这桩婚事，违背天条、广发请帖、大宴宾客，种种行为都是在和玉帝叫板，元始天尊这个行为无疑是给他撑腰，向三界宣告：“杨戬，我罩的，懂？”他的底气也有这部分原因，第一，他做为阐教第三代出类拔萃的弟子，向元始天尊、向玉鼎求援，都是直接的关系，而杨婵做为三代弟子的妹妹，就隔了一层，关系远了，很多话就不好说了。第二，杨戬经历封神之战肉身成圣，他的战斗经验、意识、眼光、包括抗风险能力都远远超过杨婵，虽然抱回小玉的政治风险还在杨家人身上，但是他明显比杨婵更适合对抗风险。杨婵有宝莲灯，可是当初封神之战，谁的手里没有法宝？谁的身上没有绝活？结果呢？前仆后继上了封神榜。</p> <p>寸心在这个时期已经严重焦虑，她原本以为杨戬上天做了司法天神就可以和西海和解，可是杨戬做司法天神的条件让她彻底断绝希望，她已经在西海和婚姻中选了婚姻，更加迫切的希望能够解除西海危机，却没有理由再对杨戬施压，她的压力、担忧、痛苦层层叠加却无法宣之于口，兄长小白龙又遭难。她没有经历过封神时期，虽然杨戬和梅山兄弟谈过这些，但是“纸上得来终觉浅”，她对这些危机感受不深，杨戬为了保护她，很多天廷的威胁都没有告诉她，西游的暗藏危机她更是无从察觉，信息渠道的封闭让她对眼前局面造成极大的误判，随之而来的又是狐妹身亡的噩耗、小玉的到来，加重了她内心无法诉说的压力，她快崩溃了。小玉被姥姥抱走后，她表现出来的是怀疑小玉是杨戬的私生女，其实不是她不相信杨戬的人品，而是她的痛苦终于有个名正言顺的出口，她借着这个理由再发泄负面情绪，口不择言。可是杨戬相信了她的胡言乱语，激动下伤害了寸心。哮天犬要找寻小玉时，姥姥出言解释，她抱走小玉只是不想让女儿的孩子流落在外，这真是神来一笔，杨戬身边潜藏的危机被姥姥这样化解了，轻描淡写又歪打正着。可是杨戬和寸心的裂痕加深了，杨戬借酒浇愁愁更愁，西游危机，他抽身了，西海危机，他该如何呢？寸心的痛苦，他能怎么做呢？王母又在此时下了一剂猛药，偷换概念，把狐妹的死亡、寸心的痛苦，都用话术说成了杨戬导致的结果，他终于动摇了，答应王母会去做司法天神。回到家中，寸心的崩溃更是让他觉得解除她的痛苦唯一办法是和离。王母手握天条算计杨戬的一局棋，下了一千多年，至此事成。<br>
天条贯穿全剧，从瑶姬下凡婚配，到杨戬受捧大印回忆众多受害者的大结局，它的身影无处不在，可是限于篇幅，没有拍的详细，宝莲灯的影响又让人看剧时不自觉用上帝视角的信息衡量全剧，造成了剧中人和剧外人的信息差巨大、偏差巨大，却不自知。特别是宝前的政治隐喻都只是轻轻点一笔，寥寥数语，言有尽，意无穷，小玉这段也是一样，当初看宝前时满脑子都是舒畅青春美好的样子，没有发觉其中的重重隐患，现在想来才看出杨戬的艰难处境，在婚姻矛盾的表象下，是暗流汹涌的政治漩涡。</p></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/ALLforJianXin/allforjianxin.github.io/edit/master/docs/97.嗑学/10.杂谈/250326.小玉事件背后的政治漩涡.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=%E6%9D%82%E8%B0%88" title="标签">#杂谈</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/25, 21:49:45</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/4de11f/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">天条——宝前中无处不在的阴影</div></a> <a href="/pages/80a95a/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">宝前时间线中戬心的政治敏感度对比</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
