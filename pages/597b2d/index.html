杨戬坐起来拍拍衣角，朝卧室看了一会儿，不见动静，便把枕头提到客房，梳头发换衣裳，勉强打起精神，再看两眼卧室，还是没声响，只得皱一下眉毛叹两口气，推开大门自己出去。<br>
不过几步路就到庙里，他把垮了几天的脸强行撑起，先与守庙的老树仙打招呼，再和管细务的庙祝聊几句，便自己走到屋中，不翻书，也不喝茶，就在那闷坐。<br>
外头香客渐多，日头越发高了。<br>
眼看近午，杨戬再坐不住，在屋里转了几圈，隐起身形，跑到院中看动静。<br>
戏台上唱得热闹，来烧香的来看戏的挨挨挤挤满院子都是。有人撩起衣角擦汗，斜起身子去蹭别个蒲扇的风。<br>
“还不下雨嘞？”<br>
“往年家上午头都下过了，今年子硬是点风都没得。”<br>
杨戬心里发虚，寸心不会不来了吧？<br>
灌江口的百姓早就习惯了这每年六月廿四的雨，它年复一年如期而至，有老人甚至以一辈子不错过一场雨为傲，走不动了也要叫孙子抬过来。<br>
治水时受到庇护的人，受众仙托梦的人，参加了婚礼的人，早不知轮回了多少代；但有二郎庙在此，习俗代代相传，人人都知道六月廿四乃是二郎神寿辰，这天有庙会，能看戏，还有一场涤尘消暑的洗山雨。<br>
这……寸心不会真的不来了吧？<br>
杨戬心里打鼓，正不断设法又一一推翻，天色忽然瞬间阴了，不知哪来的云团骤然压下，那雨哗的落地，噼里啪啦，香客一片欢腾，小孩子看到香烟遇水不熄都惊讶地叫起来，喊大人来瞧。<br>
雨又急又快，呼啦啦一阵洒过，又随云层消散停止。以杨戬目力，都只看见半边龙尾隐在云中，那龙显然一丝也不想露出来给他看。<br>
他呼出一口气。<br>
好歹来了……她还是记着日子，还愿意来走这一遭。杨戬顿时来了精神，他这就回家去！她肯定不生气了，或者起码消一半气了！</p> <p>一声闷响，是靠垫砸在门上。<br>
杨戬摸摸鼻子，转回客厅。摆弄半天茶具，在脑子里想了一箩筐的话，不知道选哪个来说。<br>
自打三天前他梗着脖子跟寸心顶了几句不中听的，被公主扫地出门，已在客房住了三天了。那屋子冰冷空旷，连她一根头发丝都找不到，完全不是人能呆的地方。<br>
这三天里，寸心没跟他说过一句话，主卧的门始终紧闭，他敢强行开门她就敢夹他手指。<br>
她有时出去逛街吃饭，他敢跟着离她近些她就用定身术定他。杨戬远远看着她对每个人都笑脸以待，又提了一人份量的餐食回去，并再次把他挡在主卧门外。<br>
好不容易捱到今天！今天是他生日诶！<br>
上午她都去庙里施了一回雨，下午也会出来和他庆祝一下吧？会吧？……会吗？<br>
杨戬的心忽上忽下地吊了一会儿，打定主意到晚上再去好好道个歉。他去客房翻了半晌，找出寸心夸过的一件衣服穿上，希望她看了喜欢；再重新梳过头发，好显得精神些，接着在客厅端正坐好，决定今天不坐到天黑就不起来。<br>
万一她心软出来，须要让她第一眼就看到他。</p> <p>坐着坐着，太阳逐渐偏斜，松树的影子也拉长了。杨戬逐渐焦躁，有些坐不住。<br>
忽然啪嗒啪嗒的脚步声从外头响起来。杨戬精神一振，她什么时候出去的？<br>
他立刻就要起身，寸心进来一个瞪视把他钉住：“坐着。”这是她三天来对他说的第一句话！杨戬立刻坐好，仰头看她：“寸心。”<br>
哮天犬看了一眼主人快要笑烂的脸，转头去门廊躺着了，不然它会忍不住把尾巴借给主人。<br>
杨戬怎能不心花怒放？寸心用托盘端着一个大碗，那显然是给他过生日来了！<br>
她走到桌边时杨戬已飞速收好茶具腾出桌面，她把托盘重重放下，咣当一声响。<br>
一碗细面，码着卤肉和葱花，热腾腾显然刚出锅。卤肉闻着是城口刘嬢家的，比西街李三家的香；还有一小碟酸豇豆，是他泡的，平常寸心都让他去捞，自己不爱伸手进缸子。<br>
杨戬受宠若惊，傻笑着问出一句废话：“给我的？”<br>
寸心绷着脸，后退一步坐在地台上，靠着凭几看他，说道：“吃。”<br>
“好，好，我就吃……”他也不怕烫，抄起面条就往嘴里送。<br>
几口吃完，连汤都喝得干干净净。<br>
他抬头期待地看向寸心，正要说点什么，寸心先一步站起来冷哼一声，端起托盘：“坐着别动。”<br>
杨戬跳起来要追，又被她骂了一句瞪了回去。<br>
有一碗面吃，还是她亲手煮的，怎么不是一个接近完美的生日呢！<br>
接下来的要务是设法回卧室。他琢磨着，再等一盏茶时间，要是寸心又回屋，他就翻窗子进去，动作要快，响动要轻，最好从浴室那头走，不易发现。<br>
正思索间，寸心又从里头走出来。“啪嗒”一声，一件叠好的衣服摔在他身上，她说：“穿。”<br>
杨戬二话不说立刻起身脱衣裳。<br>
他以为今天的惊喜已经结束了！没想到还有！<br>
新外套上有同色细线绣的暗纹，通身遍布，一看就是费工颇久，耗费心力。也不知她提前多久准备的。<br>
寸心双手抱胸看着杨戬穿新衣，等他自己整理，挑剔的眼神从他肩膀再到腰身一寸一寸扫过去，看完了点点头，无视他灼热的眼神，自顾自冷哼一声，抬脚就走。<br>
杨戬拔腿便追。<br>
几个大步赶上，卡在门扇之间，“寸心……”他尽力显得可怜一点，“今天就让我进去吧，啊？”<br>
寸心扒着两扇门使劲往中间拉，臭不要脸的混蛋夹在中间，她伸手推也推不动，那厮脸都让她按歪了，还硬要往里挤。“你出去，出去！”她抬脚要踹，让他两腿一并夹住她一条腿，趁她站立不稳，伸进胳膊圈住她踉踉跄跄冲进来往里扑。<br>
“不要脸，混蛋，你松开！”寸心推不动，就使劲儿捶他，“杨戬！”<br>
“哎，”杨戬喜滋滋地冒着傻气，“我在呢。”<br>
寸心叫这无赖气得没法，奋力扣他指头尖，“松手松手松手！”好容易掰松了点，“你挤疼我了——”杨戬这才放松臂膀，又要去捧她脸。<br>
她趁机拧身躲开，跑进里间扯下帐子：“你不许来。”掀开被子把自己卷起来裹成蛹，心说才不要理他，先等他自己演半个时辰。<br>
杨戬果然立刻跟进来，搂着被子卷开始说好听话。又是道歉“我错了”，又是表态“寸心打我吧”，还说什么“客房太冷”。<br>
寸心原本打定主意不说话，听到这又忍不住骂他：“满嘴胡话，一看就不老实。”都六月下旬了还冷什么冷！杨戬也不狡辩，接着诉苦道：“几天都没睡着，眼睛都沤了……”<br>
寸心忍不住回头看他，偏偏卷着不好动，扭头只扭到一半。杨戬立刻善解人意地压着她翻到被子卷的另一边：“你看，你看。”把脸凑过去，几乎和她贴上。<br>
那双黑黝黝的眼珠里烧着火呢。<br>
寸心一口咬住他摸上来的指头，含含糊糊地骂他骗人。其实她早就没那么生气了，但跟杨戬怄气也挺好玩的呀，看他耍无赖哄人的样子，叫她想知道他还有多少花招可以使。<br>
杨戬等寸心啃过两个指节，才救出自己的手指，搂着被子卷去亲她。<br>
夏被单薄，卷几层也还是能摸出内里轮廓来。杨戬只嫌两条胳膊不够用，恨不得上上下下都揉个遍。忽又想起自己还穿着新衣，忙坐起来脱，“可别弄皱了”，把外套展平挂到床尾衣架上，回头一看寸心瞪他，索性再脱一层，扑回去解被子卷：“好歹叫我赔罪……”寸心故意跟他对着干，扯紧了不给他解，杨戬一边压着找被角一边亲她，什么“感谢公主惦记”，“寸心手艺真好”，“累了吧我给你按按……”乱说一通，寸心一个不小心没忍住笑出了声。<br>
杨戬闻声心花怒放，把乱七八糟的被子卷两下扔到一边，就要往她衣服里伸手。寸心还要蹬他两脚，他用胸口抵着，躬起身子往前摸到她腰上：“叫我伺候你……快活。”<br>
他嗓音也低哑下来，眼睛直勾勾盯着她，好像在用眼神舔她。寸心哼了一声，脚尖顺着他的胸口滑下去，在他搏动的物件上点压，默许了他的动作。<br>
杨戬从她腰处往下一口气剥干净了，抬起她的腿埋头进去，噙住穴口吮吸。寸心喉咙里发出声音，手指攥紧身下的床褥。他早就研究透了她的喜好，知道怎样用牙齿轻刮肉豆最能让她快活，知道怎样用舌头翻搅最能让她颤抖。<br>
她抓紧了他的头发。<br>
她刚要抬腰，杨戬已将她托起。<br>
她叫出声。<br>
杨戬只觉得满嘴甘甜，抹几下脸，看寸心闭着眼噙着泪只顾张口喘息，顿觉志得意满且意犹未尽，再次躬身下去，直到她大腿颤抖着夹紧他的脑袋，让他饮个尽兴，他才依依不舍将她放下。<br>
寸心隔着湿漉漉的睫毛，看杨戬一件一件扯下衣裳，露出精壮身躯，身前昂扬跳动的肉杵冲她凝露。她腰腹更软，催道：“你，快点。”<br>
杨戬哪用她催，膝行向前顺畅地滑进去，一边挺腰一边解她上衣，一双手四下抚摸揉捏，“快活吗？”他时快时慢，一下轻一下重，还非要让寸心“再大声点”。<br>
寸心正闭目享受，哪能容他得意啰嗦？叫他压着不便抬腿，就伸手摸索到腰上去拧他。杨戬吃痛猛冲一阵儿，听她哼叫又颇自得，俯身搂去胸膛紧贴，翻个身把她放在身上顶。<br>
寸心嫌他顶得乱晃，扳着他的肩膀要翻下去，两人贴着肉搏斗似的拧了半天，杨戬要看龙女娘娘要咬他，伸手下去摸着那肉豆一阵揉，叫她颤抖着泄了一回，也不给她缓一会儿，趁她一时软绵绵使不上力，侧躺着抬起她的腿，继续没轻没重地弄，还把嘴唇贴到她肩头脖颈四下舔吮。<br>
寸心把手按在他坚实的胸膛上，随着动作哼哼，听杨戬在她耳边喘。她原本打算今天要好生骑他一骑，叫他随自己摆弄，还要求饶才算……真是的怎么稀里糊涂就让他得手啦……算了算了明日再骑，今天且享受着……<br>
她扳起杨戬的脸去亲他，叽里咕噜断断续续说了一通骂他的话，很快又让他送上巅峰。<br>
杨戬兴致勃发地弄个没完，寸心每泄一次身他就换一个姿势，美其名曰“赔礼道歉就是要有诚意”；等寸心想起来说一句祝他生日快乐，他又讲些道谢的话，扑进浴池再战数回。<br>
到天色将明，寸心实在困倦，坚持要睡觉，他才恋恋不舍射了最后一次。<br>
没明说，也没拒绝，杨戬就这样，借着生日的机会，重回卧室，重新搂着媳妇睡喽。<br>
