!----> <div class="theme-vdoing-content content__default"><h2 id="前情-《狎龙》"><a href="#前情-《狎龙》" class="header-anchor">#</a> 前情 <a href="/pages/97385a/">《狎龙》</a></h2> <h2 id="前情-《真君醉酒逞豪强》"><a href="#前情-《真君醉酒逞豪强》" class="header-anchor">#</a> 前情 <a href="/pages/97385a/">《真君醉酒逞豪强》</a></h2> <hr> <p>几日前那郎君生辰，特特诓了小龙女到庙里，带她边游边逛一路上山，忽而迎面一间“龙王殿”，香烟缭绕已然是享了供奉，神龛下还挖出小池充作“龙宫”，亦颇见意趣和用心。后来至正殿，更见主神侧旁添立了章淑夫人神位并神像，神像眉眼分明就是照着她模样塑造。唬得个小龙女不胜惶恐，连连摆手：“这怎么当得起？”那郎君立刻抚扇俯身至她面前道：“温克令仪曰章，窈窕清湛曰淑，怎么，这称号寸心不喜欢？”小龙女还未及答言，他即起身，“啪”一声收起扇子惊来随从就要近前，他话头启曰：“寸心喜欢什么我让皇帝老儿再改了就是……”小龙女又连连跺脚忙冲随侍们摆摆手先止了他们脚步，再来牵住郎君衣襟：“没，没，没有不喜欢……”<br>
那郎君实已有了些不耐，只压下性子回身又问：“那又是如何？”话还在说着，眉头却都紧起了几分，“我说寸心当得起就当得起。”端的是一幅说一不二的威严帝君做派。<br>
小龙女张张口又噤了声，她刚开口时只是有些惯性的谦逊使然，虽然话出口后不知为何确是腾起些害怕和惶惑来，但瞧她的二郎言语殷殷又斩钉截铁，她一时也想不出再有什么道理谦辞了。如此这桩事就暂且作罢，撂了开。</p> <p>转眼进入七月，那郎君又起了一桩事，要与她在七夕庙会上扮演鹊桥仙——戏神真君亲扮牛郎，寸心自然就是他的织女了。<br>
这故事讲的是汉时南阳郡，有位聪明忠厚小伙儿牛郎，兄嫂与之分家只遗他一只老黄牛，牛郎贫苦却心地善良，尽心竭力照顾老牛治好了它的腿，为表报答老牛指点他结识了仙女织女。牛郎和织女二人一见钟情，后来织女便偷偷下凡，嫁给牛郎做了他的妻子。婚后夫妻二人仍然友爱睦邻，帮助乡亲，织女还把天上的天蚕带来人间，教大家养蚕、抽丝，织出又光又亮的丝绸来。二人还生育了一双儿女，一家人和和美美，尽享天伦之乐。可惜好景不长，天帝很快得知了此事，王母娘娘亲自下凡来带走了织女，恩爱夫妻被强行拆散。</p> <p>也不知是哪个走漏了风声，几日间七月七日戏神显灵的消息遍传川蜀，到这一日百姓们扶老携幼上山，不仅灌口城万人空巷，远处成都、眉山、乃至乐山，亦有百姓到来。<br>
头几天排练时心力多在背词记谱上，尚自不觉，这天寸心穿了戏服蒙上盖头，循着排练时走熟了的点位三跪九叩，耳边响起真实的百姓们发自内心的热烈欢呼声：“夫妻恩爱！永结同心！”念力从四面八方涌上身来的那一刻，寸心恍然觉得这好像就是一场真实的婚礼。<br>
及至杨戬掀开盖头，看到的却是个梨花带雨的小龙女，唬得他心头肉猛地一跳：“怎么？寸心哪里不舒服了？”小龙女猛猛摇头再三说自己这是高兴的、幸福的泪水，戏神老爷总算是勉勉强强将信将疑，先用手去抹她眼泪，龙女的泪珠儿落下，半空中化作珍珠一颗颗砸在戏台上，又弹起来飞入人群中，趁着人们弯腰捡珍珠的空档真君老爷欺身上前吻住了他的小龙女，也有一直没去捡珍珠的人瞧了个正着，带头鼓掌，继而人群中又一批批一层层爆发出一阵阵越来越响的欢呼声。<br>
然后的夫妻耕织、生儿育女戏码，温馨感人。寸心对演他们一双儿女的小演员嘘寒问暖，和蔼逗趣的画面落入杨戬眼中，亦印在了二郎心上。<br>
再然后天地变色天兵临境，台下百姓直呼“逼真！”杨戬心底正自嘲“当然逼真，照着真的复刻的”，一只温热小手探入袖中握住了他的手。他忙整理表情准备安慰她不要害怕，转过头去视线却直直撞进她满是关切的眼眸中——她是来安慰他的！</p> <p>她都知道？<br>
她竟然知道？！<br>
她……真的知道吗？</p> <p>一时间天地都安静了，一刹那万物都褪去了色彩，只余小龙女望着他眼眸秋水般脉脉含情，又娇艳欲滴。</p> <p>那是足以让天地色变又可以使三界凝固的一刹那，那是愁肠百结又百转千回的一刹那。那一刻杨二郎想了许多许多，想到了父亲、母亲、大哥、三妹，想到了降妖辟魔路上的刀口舔血，想到了天廷朝堂上的尔虞我诈，也想到了柜山上神庙里的那一夜。那一刻他又想不了那么多，他的心只够用来想眼前的这个小龙女，只能想起在神庙时她撞进他怀里的火热，和温暖小手牵住他的此刻。</p> <p>寸心其实没有太多知觉，因为实在太快了。<br>
她只觉得自己的手被反握住，好似有点紧？好似也没有，他握得很小心。<br>
她又觉得他回望向她的眼眸里好像漫上来些什么？但恐怕是她看错了，因为她连眼睛都没眨，她现在在他眼中看到的只有无边的深邃的醉人的温柔。</p> <p>却说那边厢扮演王母的庙祝一通演罢，念完台词不见主神接戏，定睛一瞧戏台上那粉红泡泡直冒满得快要扑出来了的氛围，裂开大嘴就想笑忽又想起来自己的人设，赶紧清清嗓找回形象，寻思了一下正好借机发一下戏瘾，于是乎先是厉声斥骂演尽了王母的破防无力，又挤出几滴泪来假作语重心长，再切换至痛心疾首，捶胸顿足道：“为娘养育你，呵护你，你却、却……”<br>
“却”个什么她倒是也说不出来了，对面正儿八经是自家神主，平白无故怎可随便面刺主上？况且她家神主神威赫赫玉树临风，尤其是眼下分明可见的痴情专情用情深情，分明就没有缺点！硬叫她现编她也编不出来呀！</p> <p>却幸而天无绝人之路，庙祝一通言语里竟对上了一个关键词——“为娘”。<br>
寸心是与母亲拌了几句嘴，又贪爱人间热闹繁华，更兼由趁机拜谒二郎庙的心事所驱，故而才离了西海一路辗转，终至柜山神庙里得偿了平生所愿。心愿既了后她虽仍日日与那郎君恩爱欢好，但得空时对家人的思念亦是与日俱增起来。<br>
所以寸心此时被庙祝一声“为娘”触动心弦，不由得就扭过头来看她——“瑶池金母”扮相雍容华贵也福态，日光下透过妆容隐隐还显出些庙祝自身面相所带的慈爱底色——寸心并不怎么记得王母娘娘的样子，她只在幼时受封西海公主上天谢恩时匆匆一瞥过，而此时庙祝的身影更多地让她想起了自己的母亲。<br>
她想：“她出来这么久了，母亲想她了没有？”</p> <p>可是寸心脚步随心却才刚移两步，发现戏终于能接上了的庙祝欣喜若狂，赶紧招呼“天兵”、“天将”：“速速将‘织女’与我拿下！押回天宫呀呀呀呀呀呀！”然后拔下头上金簪，顺利地，完美地，演出了“金簪划银河”的戏码。<br>
台下掌声雷动，观众都被“牛郎”和“织女”真挚的感情和“演技”感染，掌声中啜泣声此起彼伏不绝于耳。<br>
寸心被“天兵”“天将”拉着一只手臂，另一手极力伸出极力挣扎着向着杨戬的方向，杨戬饰演的牛郎在这场戏里要被“天兵天将”按在原地半跪着不能起身，他正走戏间忽见他的小龙女竟挣开了押解她的“天兵天将”——毕竟草头神所扮，他们也不敢真拉住人死不放手。</p> <p>寸心奔向杨戬，杨戬这边压住他的是草头神首领比较知事，见状忙也暗暗招呼这边的弟兄们放开神主，同时顺势给机关组打起暗号，让他们掐好点儿正正好好在“织女”奔入“牛郎”怀中被稳稳接住时，放下幕布结束这场戏。<br>
之后就只剩最后一场了。结局尾声本就要以皮影戏的形式演出，此时也不过是先多加一句“织女最终还是被王母娘娘强行带回了天上”，然后就可以再接续“老牛告诉牛郎，穿着它的皮做的鞋子便能飞天，说完就咽了气……”然后继续讲完他们隔着银河相望，以及七夕鹊桥仙的故事了。</p> <p>二郎庙里热闹还在继续，主位正神却抱着他的小龙女已经回到了家里。</p> <p>戏神老爷这话是把人圈在床上问的：“哭什么？怎么又哭了？”<br>
言语本身似乎带着些指责的意味，或者说大多数这么讲的人，其目的都是指责——但此时被杨戬念出来，却是说不尽的温柔与关切。同时杨戬俯下身，轻轻吻在寸心眼角，他想吻尽她的泪痕，可怎么都吻不尽，只好再问一遍：“哭什么呢？”语调又轻了几分。</p> <p>寸心透过朦胧泪眼先瞧了他一会儿，忽然起身扑来，白皙柔弱的双臂，紧紧搂住了他。她在他耳边哭泣、哽咽，她说：“不要……寸心不要回家。寸心不要离开二郎……不要……”<br>
忽而有一种隐晦却巨大的满足感，从杨戬的心底弥漫上来，让他那颗从戏台上开始就悬着的心，至此时似乎终于可以稍稍放下一点了。<br>
还好还好，只是西海，只是回家，只是不想回家。不想回家，那就不回呗。</p> <p>杨戬转过头蹭蹭龙女柔嫩的小脸，没忍住，在她耳畔偷一口香。<br>
杨戬大掌抚上她单薄的脊背，抚摸、轻拍，安慰着她。他说：“没事啦，没事啦。都是故事，那都是戏文里的故事。<br>
“岳母大人才不会对寸心这么凶呢。”<br>
这里他略微停顿了一下。</p> <p>“王母抓织女回去是因为她耽误了织天上的彩霞。”天廷下发的公文上确实是这么说的。<br>
“寸心在家是岳父岳母心尖儿上的宝贝，是千娇百宠的小公主，岳母没有这种理由抓你回去呀。”<br>
话到这里杨戬又停顿了一下。<br>
在寸心看不到的地方他深吸口气猛睁大双眼，稍顷，又吐气放松下。<br>
“没事的没事的。寸心不要害怕。没事的，没事的啊。”</p> <p>寸心其实也知道，母亲总是最疼她。她的母亲大约并不会像戏里的王母娘娘那样致力于拆散有情人一对又一对。可是当戏里的“王母娘娘”喊着“天兵天将”来抓她的时候，她究竟看到了什么？那位“王母娘娘”又仿佛不只是和她母亲的身影重叠了。<br>
寸心不知道，不清楚，她只是害怕。她只是没来由地害怕，是怕失去她的二郎吗？她隐隐约约地怕，会不会有人要来把他们也拆散呀？</p> <p>他又抱紧了一点。他说：“寸心也是杨戬心里的宝贝，唯一的宝贝。”<br>
他的唇开始在她颊侧、耳畔、颈旁、肩头、胸口……一路游走。他的唇在惹火，似乎渐渐把她的泪水，真的蒸干了不少。<br>
终于，她笑了。<br>
“二郎，好痒。”<br>
她笑着推他没什么力，她笑着钻进他怀里。<br>
他暗暗松了一口气。<br>
她腮边还挂着未干的泪滴，她眉眼弯弯笑得像柔软的小猫咪，像想起了什么小秘密。良久她似乎终于下定了决心要和他分享，她攥紧小拳头给自己打气，她吐出的词句轻飘飘的：“二郎，今天在庙里，我好像……我感觉……”<br>
“感觉什么？好像什么？”<br>
“好真实。我觉得就好像是真的婚礼。”<br>
杨戬呼吸一滞，话到嘴边又咽下去，换了一句：“寸心喜欢吗？喜欢的话……”<br>
寸心喜欢那就再来一遍，一遍又一遍，都可以。<br>
小龙女不知道他怎么突然又急促了呼吸，她只觉得身上忽然一轻，又一重，忽然他从她的视野里消失了，占据她视野的满满尽是热情的红。忽然他又掀开红纱闯了进来，他破开红雾闯进来继续吻她，他的吻沉重而焦急，他们的呼吸和睫毛都交缠在一起。</p> <p>繁复的礼服用法力穿上只要一秒，却要用灼热的双手一件一件缓缓剥去。<br>
当最后一件小衣也为他敞开，杨戬看着躺在嫁衣铺陈的硕大红花中心花蕊般娇嫩的龙女，她在他注视的目光之下，似乎微微发着颤，却又主动呼唤他，无疑充满了勇气。<br>
“二郎……啊！”<br>
他没有等她唤他第二声，也没有任何前戏，他一寸寸挤进她的身体。</p> <p>杨戬甫一进入就被龙女温热的软肉热烈地欢迎着，只是此刻还尚无水液的润滑，所以他进展有些迟缓，但却微妙地，竟更加亲密。</p> <p>“啊哈”小龙女亦有点不太习惯，呼吸急促胸脯剧烈地起伏，不过她那点力气拿来对付他的粗壮他的坚硬，似也近乎无益。<br>
磨人的顿痛由内而外由下而上缓缓弥散，弥散到最初那一点仿佛似乎已感觉不到痛了，虽然她仍不知道她的二郎今天这是怎么了，虽然她想象不到白天戏台上他内心深处的山崩地裂狂风暴雨。可她知道为了她的二郎，她做什么都愿意。</p> <p>杨戬的呼吸粗重喷在她颈侧耳边激起她心头层层涟漪。他被她柔弱又坚韧的内里重重绞索层层榨取，进取不易退也艰难，他退无可退，于是他只能进取。<br>
小龙女又开始啜泣，牙关都打起颤。她由内而外的颤抖却让他深深着迷。<br>
似蝴蝶振翅似花落飘红雨，似星辰闪烁，又似青苗破土般绮丽。</p> <p>良久，他又挤进一分。她忽然“哇”地一声哭出来，她喊着他的名字：“杨戬！……疼……”<br>
他又想起了柜山之上那一晚，那一晚他都没有弄疼初尝情爱的小龙女，那一晚他都可以让她欲死欲仙，心驰神荡。可今晚……<br>
快两千岁的二郎真君今夜之前只知道“关关难过关关过”，如今这一刻，他才深深理解为什么世人都说“情关难过”……<br>
杨戬手臂又加了几分力，紧紧抱住小龙女。他埋头到寸心颈侧，寸心听他的呼吸声近乎快要震耳欲聋了。<br>
他埋头在她颈侧说话声有些沉闷：“寸心……”又顿了片刻，“就允了杨戬这一次吧。”</p> <p>“嗯。”</p> <p>一边亲她粉颊和耳垂，一边坚硬的肉杵硬生生破开软肉层层直抵她最深的秘境里。粗壮的肉棒一插到底，磨一圈，缓缓抽出来，再一插到底。每一次抽得缓而轻，插得却又深又重，似挟着雷霆万钧之力。<br>
她哭得更厉害了，却不是肉体更痛，起初的涩滞随着被他一遍遍占有而渐渐褪去，涌起来的是破碎的呜咽和婉转的娇啼。<br>
她哭得更厉害了，可她的手却不是推开他，她却伸展双臂也回抱住他，她的手攀上他脊背，在他又一次的挺动中小龙女的爪牙霎时也给他留下红痕几许，在他一次又一次的挺动中，积累起纵横交错浅浅深深的痕迹。</p> <p>杨戬直起身来，居高临下欣赏她的美丽。欣赏她雪白的皮肤，欣赏她丰润的唇线，欣赏她不是戏台上的演技，不是幸福里的感动，也不是被吓到的恐惧，欣赏她的泪泉这一刻完完全全在为他流溢。<br>
终于。<br>
终于。<br>
“寸心，全吃完了。”轻笑继续，“寸心把我全吃掉了。”<br>
欣赏她肤上红霞应声飞起，欣赏她妙到毫巅颤抖不已。</p> <p>小龙女越是哭泣，越是艳丽。<br>
战神的必备素质是耐力。<br>
尽根没入后的每一次抽插都要走过最漫长的路程，他那可怕的巨物时而隐蔽时而显现，她柔嫩的小腹也随之时而圆润，时而现出微微的弧影，凹陷下去。<br>
战神的素质也必须有大刀阔斧杀伐决断，必须在机会来临时果断冲锋陷进阵里。<br>
龙女的小腹全由他控制着呼吸，花谷间伏兵也漏了行迹。短兵相接中“咕啾咕啾”水声愈发清晰，杨戬扯起唇角长出长入杀得性起，小龙女哭得上气马上就要接不上下气。</p> <p>“杨戬，杨戬……二郎……二爷………”<br>
小龙女声娇嗓甜总能把他的名字念得千回百转，泣涕间更镀上一层勾魂摄魄的魔力。</p> <p>杨戬身下杀伐无有稍歇，俯下身要去吮吻她眼角泪滴。</p> <p>小龙女绷直脚背和手臂，本就逼仄狭小的甬道霎时更加紧窄，对着他的肉棒死命绞弄和吮吸，馥郁蜜露喷薄而出，夹在两人腹间被拍打起沫，再喷溅得四下里。</p> <p>却只行至半途。<br>
因为。<br>
因为他看到晶莹的泪珠才离开她的眼眶就凝起，起初像盐粒，接着像雪花，然后一颗又一颗的小珍珠滚落，四散开来嵌入锦绣衣里。</p> <p>深陷阵中的兵卒兀自还冲杀不休，主帅却定定地出了神——戏台上的飞泪化珠是川主给信众分享喜悦和甜蜜，龙女泣珠的传说却难道真化作了眼前的奇迹？</p> <p>“寸心……？”<br>
“唔……杨，杨戬……”</p> <p>小龙女显然已经应接不暇，不过，没关系。<br>
就自己去衔了一颗夹在吻里算她画的花押，余下的他便可尽皆笑纳——<br>
纵横驰骋间小龙女哭出的小珍珠更多了，越来越多，滚在枕上掉在床上交错着弹动着，滚到衣褶里滚到她腰后滚到他膝下，滚到他们紧紧交叠只偶尔稍离的腹股之间，夹在身体和锦服的缝隙里，夹在身体和床榻的缝隙里，夹在身体和身体的缝隙里，在龙女的雪肤上硌出一块块一道道触目惊心的殷红，于是她更哭得厉害了，于是珍珠愈发越滚越多了，于是他挺动得愈发又频又急，于是亦不知窗外夜色明或者暗，也不知今日鹊桥几时搭起，他只知道他的小龙女，现在在这里，和他在一起，他只知道今夜是他的小龙女，给他的奖励。</p> <hr> <h2 id="后续-《小龙女相思苦无计-二郎神蹈海赴鸳盟》"><a href="#后续-《小龙女相思苦无计-二郎神蹈海赴鸳盟》" class="header-anchor">#</a> 后续 <a href="/pages/ae54dc/">《小龙女相思苦无计 二郎神蹈海赴鸳盟》</a></h2> <h2 id="后续-《真君殿姐妹喜相见-彩云间龙凤逞祥形》"><a href="#后续-《真君殿姐妹喜相见-彩云间龙凤逞祥形》" class="header-anchor">#</a> 后续 <a href="/pages/56c47c/">《真君殿姐妹喜相见 彩云间龙凤逞祥形》</a></h2></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/ALLforJianXin/allforjianxin.github.io/edit/master/docs/82.短篇-2026/090223.鹊桥仙.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=%E7%9F%AD%E7%AF%87" title="标签">#短篇</a><a href="/tags/?tag=%E5%BE%97%E5%AF%B8%E8%BF%9B%E5%B0%BA" title="标签">#得寸进尺</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/25, 21:49:45</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/9c43f3/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">龙三公主的新婚惨案</div></a> <a href="/pages/b5f733/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">见龙卸甲</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
