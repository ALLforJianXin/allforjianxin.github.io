YR3vLnhCVGUWBjEkr3yh4H8v9CzmsbdhzOKzsJKM90iFdaTMjRPhGVsakRvOaRidljo6H6G7j+ctrJpsP+4COhDIl0La2+FS4+5mlocBaXY5QnGZysIBYoeSsl5qQzrSj/cgNrfuEzlWBfwA+EjrZyWUvpAAAAABJRU5ErkJggg==">【联文】【十五】枯木逢春<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>天刚蒙蒙亮，两条小龙就已经醒了。</p> <p>寸心听着叽叽喳喳的声音，不禁有些头痛，这精力充沛的样子，也不知道是随了谁了？</p> <p>“娘，不是说今天要去给爷爷奶奶送灯吗？”敖憙举着四个灯笼递到寸心跟前，水灵灵的眼睛盯的寸心一点脾气都没有了。</p> <p>凡间有一习俗，每逢正月十五，要在逝去的亲人坟前点上灯笼，表达对亲人的思念。</p> <p>今年也是两个小家伙第一次去送灯，寸心也没想到她们偷偷摸摸的将灯笼做好了。</p> <p>“娘，我已经和愿愿道过歉了，先前我以为她小气，只拿我的夜明珠送人。”</p> <p>“前天我们做灯笼的时候，是她将成色最好的四颗夜明珠拿了出来……”</p> <p>敖憙的声音越来越小。</p> <p>“早知道我就不和她吵架了。”</p> <p>寸心摸了摸他的头，只觉欣慰。</p> <p>夜明珠长久不灭，用来做成灯笼，倒也是个不错的想法。</p> <p>“怎么就你自己过来，愿愿呢？”</p> <p>“她不知道从哪儿得了本书，正缩在被子里看呢，说让咱们走的时候再去叫她。”</p> <p>寸心看了看外面，起身将灯笼接过来。</p> <p>“爹爹去买点心了，一会儿就回来了，咱们去把那个看书看痴了的小呆子叫出来好不好。”</p> <p>“不然一会姑姑她们来了，愿愿还没梳洗，她该不好意思了。”</p> <p>一大一小来到门口，就听见屋内奶声奶气的读书声。</p> <p>“枯木逢春尽发新,花看叶茂蝶来频。”</p> <p>“咦？”</p> <p>“枯木逢春？这是什么意思？”</p> <p>寸心和敖憙听着声音，相视一笑。</p> <p>“娘？”杨愿闻声抬头，就见娘亲和敖憙站在门口。</p> <p>“娘来的正好。”杨愿拿着一本有些泛黄的书跑了过来，“枯木逢春是什么意思啊？”</p> <p>寸心见女儿求知若渴的模样，正欲开口解释。</p> <p>敖憙在一旁抢先开口，“你连这都不知道，枯木逢春，就是枯了的树又长出新芽，开花了呗。”</p> <p>“见你天天捧着这本书，还以为有什么高深的内容，你就因为这种书冷落我，不搭理我。”敖憙许是这两日被冷落了，迫不及待的控诉杨愿。</p> <p>“敖憙！就你懂的多！”杨愿也不甘示弱，将书收起来，欲与他大吵一架，“何为枯木，既已枯萎，又怎会发芽开花，你可别胡说八道了。”</p> <p>“我哪胡说八道了，就是这个意思。”敖憙叉着腰。</p> <p>“那你说，现实中哪棵枯了的树又开花了，你现在就给我找出来一个。”</p> <p>敖憙楞了愣，小脸一红。</p> <p>“你…你为难人，现在是冬天，哪有树发芽开花的。”</p> <p>两个小家伙天天同吃同住，默契非常。</p> <p>寸心还没反应过来，两人连架都吵完了。</p> <p>本着身为娘亲要主持公道的原则，寸心清了清嗓。</p> <p>只是还未开口，又被打断了。</p> <p>“愿愿，憙憙。”门外传来另外两小只的声音。</p> <p>下一秒，小玉就领着两个小家伙进来了。</p> <p>“刘灵，刘玉！”杨愿和敖憙两个终归是孩子，见到玩伴很快就把刚刚吵架的事抛之脑后了。</p> <p>“看看我和阿憙亲手做的灯笼。”</p> <p>“啊，我们和娘亲学做了点心。”</p> <p>四方会面，正交流为祭祖准备的东西。</p> <p>小玉冲寸心笑笑。</p> <p>“三妹和沉香呢？”</p> <p>“在院子里和舅舅整理东西呢。”小玉摸了摸脖子上带着的项链。</p> <p>很快，一大家子便来到了墓地。</p> <p>敖憙和杨愿将灯笼依次摆好，刘灵刘玉将点心放在墓前。</p> <p>四小只整整齐齐的跪在一起，磕了三个头。</p> <p>杨戬起身的同时将寸心扶了起来，还未等扶几个小家伙便自己起来了。</p> <p>看着被几个小家伙堆满的墓地，杨戬心中有些说不出来的滋味。</p> <p>当年是他亲手将父母和大哥埋起来，只有他与三妹相依为命，坟前孤寂冷清。</p> <p>如今人丁兴旺，家庭美满。他能与心爱之人共度余生，三妹也与刘彦昌和和美美的。几个孩子也开心快乐。</p> <p>家眷实团圆，一呼百诺至。</p> <p></p> <p>若是放在当年，这种场景是他万万不敢奢望的。</p> <p>“爹娘，舅舅舅母，我带着孩子和小玉去万窟山了。”</p> <p>“那二哥，我和刘彦昌也先走了。”杨婵见沉香几人离开，便拽着刘彦昌要走。</p> <p>杨戬忙出声，“不急，三妹不如与我们一起去灌江口，大家在一起吃元宵。”</p> <p>话音刚落，他就感觉腰间一阵痛意。</p> <p>他回头去看偷偷掐他的妻子，眼神中充满疑惑。</p> <p>“二人世界啊。”寸心压低了声音说道。</p> <p>杨戬听了她的话，恍然大悟，随即便是不满。</p> <p>他一向不喜欢刘彦昌。</p> <p>“好了好了，三妹，我们也要回去了。”寸心抢着开口，生怕说晚了又被抢了。</p> <p>“我想去逛灯会！”杨愿一把抱住寸心的胳膊，“娘，你抱着我！”</p> <p>“我也要抱抱。”敖憙抱住了她的另一条胳膊。</p> <p>杨戬在一旁看着，心里有些不是滋味，都喜欢娘亲，没一个记着他这个爹爹的。</p> <p>他挥挥扇子，几人瞬间出现在灌江口。</p> <p>四处张灯结彩，寸心抱着两个孩子走到一个花灯铺子。</p> <p>“我要这个兔儿灯！”杨愿声音软软的。</p> <p>寸心想伸手去拿那盏花灯，奈何两只手都抱着孩子，想着身后幽怨的眼神，心生一计。</p> <p>“要不你们俩先下来，娘没有多余的手了。”</p> <p>“还有爹爹。”敖憙在一旁开口了，“让爹爹去拿。”</p> <p>杨戬脸都黑了，两个小崽子，现在想起来我了。</p> <p>寸心一看他的表情，便知道他在想什么。</p> <p>“愿愿，憙憙，不如这样，你们去爹爹怀里，娘亲帮你们提灯笼可好？”</p> <p>两小只没说话，满脸都是拒绝。</p> <p>“可是你们看爹爹孤零零的多可怜，而且娘亲有些累了。”</p> <p>“是哎。”杨愿拍了拍敖憙，“你看爹爹孤单的脸都黑了。”</p> <p>最后，杨戬还是如愿的抱到了两个孩子。</p> <p>不过他马上就后悔了，左边耳朵叽叽喳喳，右边耳朵叽叽喳喳。</p> <p>寸心跟在他身旁，提着一盏兔儿灯和一盏老虎灯。</p> <p>“你们两个都不想要一盏龙灯吗？”寸心见两个小家伙一眼都不看龙灯，忍不住问道。</p> <p>要知道，她小时候可是最喜欢龙灯的。</p> <p>逛了半天，敖憙和杨愿都有些累了，特别是杨愿，一开始还异常兴奋，现在都昏昏欲睡了。</p> <p>有言道：月上柳梢头，人约黄昏后。</p> <p>上元节，也是不少男女约会的日子。</p> <p>蛾儿雪柳黄金缕，笑语盈盈暗香去。</p> <p>看着大街上成双结对的佳偶，寸心忽然也想和杨戬过过二人世界了。</p> <p>“我带你们去个地方。”杨戬忽然开口，将打瞌睡的杨愿吓了一跳。</p> <p>“去哪啊？”敖憙开口道。</p> <p>“去了就知道。”杨戬对上寸心的眼神，笑了笑。</p> <p>一阵天旋地转后，几人来到了……一片空地。</p> <p>也不能说是空地，还有几棵枯树。</p> <p>“哇！这个地方……好特别嗷。”身为小棉袄，杨愿正努力给出情绪价值。</p> <p>“这是什么地方，黑黢黢的。”敖憙在一旁拆台。</p> <p>就连寸心也没明白杨戬的意思。</p> <p>“怎么都这么看着我啊。”杨戬故弄玄虚的说道，“不喜欢这儿吗？”</p> <p>三人也不知道怎么说，一时间安静下来。</p> <p>下一秒，远处响起烟花绽放的噼啪声，满天的烟花照亮了四人所在的地方。</p> <p>火树银花落，万点星辰开。</p> <p>绚丽的烟花在枯树枝头绽开，闯进的两条小龙的眼里。</p> <p>敖憙张大了嘴巴，愣了片刻，旋即反应过来。</p> <p>“愿，愿，快看，枯树开花了！”</p> <p>杨愿也反应了过来，看着眼前的美景，亮晶晶的眼睛一眨不眨的盯着烟花。</p> <p>“枯木逢春啦。”</p> <p>杨愿和敖憙从杨戬的怀里挣脱开，一蹦一跳的看着烟花。</p> <p>原本只是早晨孩子的一句玩笑话，他竟真的当了真，还为他们实现了。</p> <p>轰隆，轰隆，烟花声。</p> <p>扑通，扑通，心跳声。</p> <p>她对上杨戬的眼睛，仿佛又回到了两人初见的那天。</p> <p>杨戬悄悄牵起寸心的手。</p> <p>“枯木逢春了。”他学着女儿的话。</p> <p>干枯的树木遇上了春天，恢复了生机。</p> <p>就像她和他，经历了磨难，终于能长相厮守。</p> <p>“对，枯木逢春，这样的美景，我们还要在一起看好多好多年。”</p> <p>更三愿,愿年年佳庆,永保团圆。</p></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/
