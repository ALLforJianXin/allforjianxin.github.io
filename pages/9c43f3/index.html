0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">龙三公主的新婚惨案<!----></h1> <!----> <div class="theme-vdoing-content content__default"><h2 id="_1"><a href="#_1" class="header-anchor">#</a> 1</h2> <p>好热，海水都是烫的。</p> <p>鲛纱帐下的人族少年宛若出尘，长睫紧闭，白衣和发丝被海风牵起，流风之回雪一般。</p> <p>绝对是身体里的奇怪感觉在作祟，敖寸心自诩堂堂西海龙宫三公主，可不是爱犯花痴的龙，眼下却没道理地对他上了一层滤镜，认为再没有比这更好看的男人了。</p> <p>救命之恩大过天，要不是她将这昏迷的小郎君从海里捞起来，小郎君就淹死了。</p> <p>让他用身体报答，不过分吧？</p> <p>……</p> <p>寸心狠狠晃了晃脑袋，强迫自己打消这样糟糕的念头。</p> <p>龙乃万鳞之尊、四灵之首，小小一个发情期算得了什么，这点兽性都自控不了，和返祖有何区别？</p> <p>理智与情欲死磕，龙生第一次，还没人教她该怎样应对这份动物本能。</p> <p>燥热难耐，她痛苦地松开领口，龙爪子不由自主地向白色帐篷里伸入，渐渐的，整个身体也被帐篷吸附进去。</p> <p>夕阳照耀下的海滩，洁白鲛纱反衬出绚丽多彩的弧光，微透的材质依稀可见此间风景，有两道影子交叠。</p> <p>昏迷之人精力有限，好在能用。</p> <p>草草两下，解了难受。寸心猛地清醒过来，给人穿戴整齐，鬼鬼祟祟地溜走了。</p> <hr> <p>直到三月后，踏进杨府。</p> <p>杨戬冰冷的目光落在她身上，仿佛要将她生吞活剥。</p> <p>“我没碰你，这孩子谁的？”</p> <p>成亲才第五天，就已经瞒不住了。</p> <p>怎么办……</p> <p>他们之间有婚约在身，四海无人不知。及笄时，天庭长公主还以未来婆婆的名义差人来西海送了贺礼。</p> <p>敖寸心却是最后才知道的，自己虽还是未嫁之身，名义上却早已是有夫之妇。</p> <p>她这个未婚夫来头可不小，天庭长公主之子，玉帝的亲外甥，阐教第三代最优秀的徒弟。</p> <p>这般人物西海得罪不起，错已铸成，不如将错就错硬着头皮嫁过来，却不想那一日荒唐射出的箭此刻正中靶心，她的报应来了！</p> <p>该怎么向杨戬解释，她在他人事不知的情况下强行与之发生了夫妻之实呢？</p> <p>面对杨戬的质问，敖寸心羞愧得头都不敢抬，手上捻着衣料，做不出任何辩解。</p> <p>杨戬见此，冷哼一声。“难怪你一直借口不与我同房，合着给外头的男人守身是吧。”</p> <p>“不是……”</p> <p>“不是？”杨戬的声音大了几分。“那就是怕我伤着你跟他的骨肉，伤害你们爱情的结晶？”</p> <p>“敖寸心……你不自爱，恬不知耻你！”</p> <p>杨戬的话音因为愤怒变得颤抖，寸心听着一脸错愕，她从来没听过别人对她说这样重的话。</p> <p>怎样才算自爱，立贞洁牌坊吗？</p> <p>人类对妻子的要求也过于苟刻了，要守身如玉，要忠贞不二，要凡事以夫君为先。</p> <p>按人间的规矩，她这算犯了七出之条吧，虽然实情比这更炸裂。</p> <p>寸心越想越气，杨戬凭什么这样骂她？他们之间不过是父母之命而已，本来就素未谋面，彼此之间没有半点感情可言，她凭什么为一个不喜欢的人，给自己设这些世俗的伦理纲常捆住自己。</p> <p>她就算行为放荡，也都是婚前的事了，一次就中非她所愿。况且这种子是杨戬自己种下的，哪怕是被迫，也是他种下的。</p> <p>他才是始作俑者。</p> <p>敖寸心勇敢地迎上杨戬那双在喷火的眼睛，道：“婚前自由，我不算对不起你。你要追究也可以，划个道出来，我跟。”</p> <p>杨戬被一整个气笑了。</p> <p>龙族的女子便是这样强词夺理的，今日算是见识到了。</p> <p>他咬牙切齿说道：“把胎拿掉。”</p> <p>“这不行，我的孩子，只能由我决定它的去留。”</p> <p>“好得很，那就和离。”</p> <p>“离就离。”</p> <p>……</p> <p>杨戬没想到才上句话接下句话的功夫，她竟然毫不迟疑地就答应了。</p> <p>他反应过来，这女人就等着回归自由身呢，可不能教她得偿所愿。</p> <p>“想跟野男人一家三口团聚啊？我告诉你，你少做梦！”</p> <p>寸心可受不了他这打翻醋坛子般的口吻，非要脑补出一个假想敌，对那个假想敌言语攻击，事实上跟争抢交配权的雄竞动物没什么两样。</p> <p>她懒得争辩，无奈叹气。“离又不肯离，过又过不好，二爷你说怎么弄吧。”</p> <p>这题似乎无解。</p> <p>杨戬沉默了很久，才说：“我给你找个没人认识的地方养胎，一直到生产完。期间不许离开一步，也不要让我再看见你。”</p> <p>各过各的，表面上还是夫妻关系，实际名存实亡。</p> <p>他图什么呢，怕传出去丢脸？还是就单纯想折磨她？</p> <p>呵，那是杨戬还不了解她，她敖寸心可是最不吃压力之龙，</p> <p>随即她不紧不慢地收拾好衣物，跟着杨戬一前一后地走出院门。</p> <p>路上碰见杨婵，姑嫂有说有笑，另一位则全程黑脸。</p> <p>“嫂子，你们这是上哪儿去？”</p> <p>“……度蜜月，游历大好河山。”</p> <p>杨婵冒着星星眼，羡慕情侣新婚燕尔，如胶如漆。</p> <p>“二哥这是怎么了？”</p> <p>寸心干笑着找理由。“别理他，他青菜吃多了，把脸吃绿了。”</p> <h2 id="_2"><a href="#_2" class="header-anchor">#</a> 2</h2> <p>大隐于市，高山有道祖，孤岛有海神。没办法，两边亲友都绕不开，杨戬带着寸心驾云辗转几个地方，最后落定在一个民风淳朴的小村落。</p> <p>杨戬尽管很不高兴，但还是帮寸心背着行囊。</p> <p>他找来一间农房，围好篱栏，村里就这条件，没有年轻妇女，就聘一个干活利索的婆子过来伺候着。</p> <p>最后不忘将寸心拉到一边，逻辑紧密地对口风。</p> <p>“你是什么人？”</p> <p>“我姓龙，外地躲水灾来的。”</p> <p>“你家人呢？”</p> <p>“男人上前线打仗，死了。”</p> <p>杨戬连忙更正她。“别说死！”</p> <p>“好，生死未卜。”</p> <p>行了，就这样吧……</p> <p>杨戬力竭地揉了揉酸胀的鼻根，语重心长道：“虽说这是你我的私事，却也关系到两家的名声。你别怪我，我心里也乱得很，需要从长计议。”</p> <p>他的怒意似乎消了一些，可语气依旧是冰冷的。</p> <p>寸心没所谓地说：“无妨，只要你不向西海发难，什么结果我都接受。”</p> <p>倒是一人做事一人当，有点骨气。</p> <p>杨戬没有正面回应，背过身，想潇洒地甩袖离去，临走竟然有些挪不开脚步。</p> <p>乡间环境是清贫了一点，总归有吃有喝，空气也好，她的日子应该难过不到哪里去。</p> <p>这样想着，他招呼来正忙着擦洗打扫的大婶，将一大包银两塞进大婶怀里，预定好农户未来一年的土鸡鲜肉、山珍补药，才心地稍安地告辞离开。</p> <p>……</p> <p>四重天云星环绕，浩瀚无垠，欲界女神云华元君瑶姬，在此当差。</p> <p>远远瞧见一个身着甲胄的女子在带兵演习，手中剑器挥舞生风，神态飒爽威严。</p> <p>良久，天兵领了差事散往天庭各处，杨戬朝领兵的女将军走近。天上一日，地上一年，于他而言他已经好多年没跟母亲好好说过话，三月前还因此与玉帝大打出手，想把母亲接回杨家去。</p> <p>“娘……”</p> <p>他才刚开口，就被瑶姬严肃的目光打断。“公差期间，喊我官称。”</p> <p>破烂天庭，就是破规矩多。</p> <p>瑶姬看出儿子心情不好，屏退左右，等到四下无人时，脸上的冷硬化开，变成温暖的笑容。</p> <p>“你舅舅打你了？”</p> <p>杨戬啐了一声。“我没这样的舅舅。还有，是我打他。”</p> <p>“哦～”瑶姬笑意更浓，岔开话题继续寒暄道：“你那个小未婚妻……西海老龙家那个……叫什么来着？”</p> <p>公务繁多，有点想不起来了。</p> <p>杨戬补充。“寸心。”</p> <p>“对对对对……”瑶姬开心地手舞足蹈，与方才练兵的女战神判若两人。</p> <p>“你也不小了，什么时候成婚啊？哪天领来我见见。”</p> <p>什么时候成婚？都快离了好吗！</p> <p>杨戬感觉平息下来不久的血气又从胸口涌到喉头，欲哭无泪。</p> <p>“元君大人，我已经新婚五日了，不行你回家看看呢？”</p> <p>瑶姬听完也是一愣，眼睛瞪得圆溜溜。</p> <p>天界凡间时间差巨大，玉帝又不准假，她还以为自己很关心孩子们的。</p> <p>看来善解人意的慈母人设不适合她。</p> <p>瑶姬干咳两声，两手负于身后，重新端起统领的架子，好让自己显得不那么尴尬。“说吧，找我有什么事？”</p> <p>还能是什么事，自然是商量两家退婚的事。</p> <p>来找瑶姬前杨戬已经在心里做了很多思想建设，寸心有孕，一直拖着也不是办法，而他也不是宽容大度到可以给别人养孩子，思来想去，也许分开才是最好的决定。</p> <p>可话到嘴边，又起迟疑。</p> <p>母亲就刚刚知道儿子成了家，才满五天就要离，她老人家听了会不会炸？</p> <p>于是杨戬迂回地换了个说法。</p> <p>“我发现婚姻原来不是我想象中的那么回事……”</p> <p>瑶姬看着杨戬失落沮丧的样子，想必是受了什么委屈。</p> <p>她轻轻拍了拍儿子的肩膀，眼里泛起慈爱的微光。“傻二郎，我还以为出了什么大事。不就是夫妻闹别扭吗，忍忍就过去了，想想以前你爹，不知迁就我多少，让的多了，她会明白的。”</p> <p>娘啊，您是一点亏不吃，全给儿子吃是吧。</p> <p>事是这么个事，理不是这个理。杨戬越听越不对劲，企图转变瑶姬的想法。“娘，你是不知道她……”</p> <p>“我儿媳妇怎么啦？”</p> <p>“……我说不出口。”</p> <p>真说不出口。</p> <p>“说不出口就憋着。”</p> <p>要疯了，这世界没有一个正常人。</p> <p>“反正我跟她过不了，这桩婚是你定的，你去向玉帝请旨把婚退了！”</p> <p>把心里话说出来，杨戬感觉全身舒畅地闭上了眼。</p> <p>耳边安静下来，瑶姬没有再反驳他的话，只是随之响起剑出鞘的金属摩擦声。</p> <p>他猛地睁眼，一脸惊惧地跑下凡间。</p> <h2 id="_3"><a href="#_3" class="header-anchor">#</a> 3</h2> <p>回灌江口时，看见杨婵在书房捣鼓她的宝莲灯。</p> <p>还是一个人好啊，简简单单，没有烦恼，轻松自在。</p> <p>杨戬释然了一些。</p> <p>他和三公主是包办婚姻没错，他从小也知道一些，以前特地去西海偷瞄过一眼，暗自窃喜，默认下这门亲事。</p> <p>不就是一个孩子吗，没什么大不了，现成的工具人在这，生出来抱给三妹，把他们放逐到华山去，他就眼不见心不烦了。</p> <p>他得先探一探妹妹的口风。</p> <p>他小心翼翼坐到杨婵身边，行为略显踟躇，咳嗽一声想引起对方注意。</p> <p>“三妹，跟你商量个事？”</p> <p>真是太阳从西边出来了，自家兄妹，说话何时这样客气过。</p> <p>杨婵扭头，越过杨戬朝他身后撇了一眼，答非所问道：“你媳妇呢，才个把月的功夫就给弄丢了？”</p> <p>上天入地九万里，再入人间已是三十个日夜。那个女人是个公主病，如今身有不便，也不知过得好不好。</p> <p>杨戬着急了，直截了当道：“你先别管。我且问你，你喜不喜欢孩子？”</p> <p>莫名其妙。</p> <p>杨婵一脸不理解，但还是深思熟虑之后，笑着点点头。</p> <p>“那我过段日子抱一个过来给你。吃穿用度算我的，你只负责带着，带远点，离我越远越好！”</p> <p>不是，这是亲哥吗？他这是什么意思？</p> <p>杨婵感觉自己被套路了，想推脱，杨戬却不给她开口的机会，一顿假惺惺的感谢，谢完就跑，剩她一个人在风中凌乱。</p> <p>……</p> <p>乡间稻田金黄，此时正值农忙，年轻的劳力无论男女都在田里割稻草，剩下几个年过半百的老妇人围坐村头，喝茶闲聊，瓜子壳撒了一地。</p> <p>“林家嫂子，雇你去的那位东家很有钱吧，那出手阔绰的，给的月钱都够盖房子了。可还要人不？”</p> <p>林婶听言嘘了一声，警惕地抬眼扫视四周，小声道：“别瞎打听，有钱人乱着呢。”</p> <p>这分明是在吊胃口。</p> <p>“此话怎讲？”</p> <p>林婶说话声更小了，几个老姐妹得耳贴耳才能听清。</p> <p>“你们注意没，龙姑娘都显怀啦！啧啧啧……造孽啊，独自躲在这穷乡僻壤生娃娃，年纪轻轻的闺誉尽毁，往后日子怎么过哟！”</p> <p>“她不是寡妇吗？”</p> <p>“不说是寡妇，难道承认自己是被主家轰出来的外室小妾吗？多丢人呐，想一想也知道，一个寡妇哪来这么好的条件，你看她吃的、穿的，员外家的小姐夫人也不过如此啦。”</p> <p>大家面面相觑，讳莫如深地频频点头。</p> <p>“我就说男人没一个好东西，把姑娘肚子搞大又甩掉不管，叫什么事儿！”</p> <p>“说的在理，龙姑娘真惨，看着锦衣玉食，实际上心里苦着呢，估计活得还不如咱。”</p> <p>“嫂子是不是真的啊，别弄乌龙了。我可看不下去，龙姑娘要真是被赶出来的，我现在就给她说门亲去。她长得好，看着也好相处，包管肚里娃娃落地前给这门槛踏破喽！”</p> <p>“天天跟着她呢，谁还有我清楚？”林婶语气笃定，不容置疑。“送她来的是一个小白脸的公子哥，满身的纨绔做派，这么久一点信没有，肯定是忙着哪里风流快活，早就把她抛到九霄云外去了。”</p> <p>消息可靠，大家你一言我一语，叽叽喳喳的，开始纷纷向林婶介绍各自还没成家的后辈亲戚。而她却点到为止地嘿嘿笑，拍拍衣服上的落灰起身就走，故作矜贵，仿佛那龙姑娘不是她的东家，而是她家里的一件宝贝。</p> <p>……</p> <p>日落了，要赶回去给龙姑娘烧饭。</p> <p>得到这样事少钱多的活计，林婶子在村里都哼着歌儿，摇着步子走。</p> <p>提上菜篮子，里头装着她精挑细选的嫩菜。</p> <p>她是有职业操守的，生活上对东家事无巨细，担心龙姑娘夜里害怕，就在屋外置了一张竹席，陪到三更才走。</p> <p>才进院子，便看见那个纨绔的公子哥坐在龙姑娘对面，两人交谈着什么。</p> <p>……</p> <p>敖寸心看着杨戬，脸上露出疑惑。“你不是说，再也不想看见我么？”</p> <p>什么时候说的，他怎么不记得。</p> <p>杨戬不回答，自顾自说：“解决了。”</p> <p>他没说太清楚，寸心一知半解的，沉默了一会儿，道：“我可以回西海了？”</p> <p>“不能。”</p> <p>“你我的婚约……”</p> <p>“还作数。”</p> <p>那他解决什么了，在心里解决的？</p> <p>寸心感到无话可说，心里乱糟糟的。</p> <p>有些窗户纸，一旦捅破，就再也回不去，至少对她来说是这样。杨戬一怒之下怒了一下，恢复到以往寡言少语，此事似乎没了下文。</p> <p>不管真相是怎样，他接受了，那就代表……他是在乎她的吧？</p> <p>可她骗不了自己，也不敢赌他的心。</p> <p>……</p> <p>有人进来，负责照顾她的林婶子。</p> <p>寸心收起思绪，扶着后腰站起来。她的小腹初显，行动开始一天比一天吃力。</p> <p>算了，她不想因为别人的一时喜恶，陷入自我消耗、自我怀疑。</p> <p>如果爱，或者不爱，都要她绞尽脑汁地去猜。那这样的爱，本就不纯粹，也不值钱。</p> <p>她不想把自己和孩子的未来，寄托给这样的人。</p> <p>“我在这挺好的，你回去吧，以后不用来了。”</p> <p>寸心表情镇静地丢下这句，回屋掩上木门。</p> <h2 id="_4"><a href="#_4" class="header-anchor">#</a> 4</h2> <p>小院里静悄悄的，林婶感受到空气里的凝固，大气都不敢出，直到杨戬幽叹一声，垂着脑袋对她说：“大婶，你先回家吧，这里有我守着。”</p> <p>糟糕，她只是八卦了几句，难道被他们听到了，现在要解雇她？</p> <p>“明天还来吗……公子？”</p> <p>她不敢骂他是纨绔了。</p> <p>“你放心，工钱不会少。”</p> <p>听到这里，林婶安然退下。</p> <p>……</p> <p>月亮升起了，墙角响起虫鸣。寸心的屋子里有淡黄的烛火闪动，村子条件有限，找不到像样的宅子，现搭工时太久，变一个又怕吓到村民。细看来，诸多简陋，她堂堂公主住在这种地方，委实受苦。</p> <p>杨戬发誓，自己绝不是有意要这样惩罚她。</p> <p>他在她房外几番徘徊，鼓足勇气抬手扣门，还没触碰到就泄气地抽回手来。</p> <p>他又没做错，为什么要低三下气地求人？</p> <p>然后他默默走回院子，在屋檐下的小竹床坐下。一墙之隔，杨戬好像听到里面传来脚步声，茶杯碰撞，有倒水的细细水流声，有人吹灭了蜡烛，床帘放下，寸心躺下时被褥抖动，布料摩擦沙沙作响。</p> <p>耳朵好，还是他臆想出的，谁知道呢。</p> <p>说来惭愧，他们是明媒正娶的夫妻，却到此为止还未在同一个房间睡过。结发礼、合衾酒……那些凡俗仪式现在看来就像过家家的笑话一样。</p> <p>他还记得她掀开面纱的样子，唇红齿白，眼睛仿佛会说话。</p> <p>她还是穿红衣最好看。</p> <p>……</p> <p>想着想着，杨戬睡着了，梦里光怪陆离，海潮翻涌，眼前有洁白的鲛纱随风搅动。</p> <p>奇异的感觉自下体蔓延至全身，使他的呼吸急促，浑身发烫。</p> <p>这个梦，好熟悉。几个月前的哪一天梦到过，腰上压着一些重量，鼻尖能嗅见发丝缠绕的清香，可是视线一片模糊，看不清对方的脸。</p> <p>……</p> <p>有一双手在靠近他，带着阳光的味道，放在他胸膛，令人暖哄哄的。</p> <p>是梦还是现实？</p> <p>不知道，睁眼看看吧……</p> <p>天亮了，白昼刺眼，比朝阳先映入瞳孔的，是寸心白皙里透着红晕的脸。</p> <p>寸心手里盖毯子的动作顿了顿，对于杨戬的突然苏醒，有些不知所措。</p> <p>“你……”她说话吞吞吐吐的，脸颊越来越红，红晕爬上了耳根。“你衣服脏了。”</p> <p>杨戬瞬间意识到什么，弹坐起身，掀开毯子低头看到裤腿上已经干涸的点点白色，恨不得原地找个地缝钻进去。</p> <p>他匆忙整理衣衫，背过身躲到老远，远到小院的篱笆几乎框不住两个人颤巍巍的脚步。</p> <p>彼此不发一语，不敢有眼神接触。一个握着折扇拼命扇风；一个假装无聊，低头用手指卷弄耳边垂发。</p> <p>许久。</p> <p>寸心仰望天空，喊了一声：“我饿了！”</p> <p>杨戬怔了怔，反应过来，自以为神情自若地走进灶房。</p> <p>灶房里发出一通叮铃哐啷。</p> <p>……</p> <p>简单早饭后，寸心惬意地躺倒在摇椅上，手上捧着一卷竹简。</p> <p>杨戬在收拾碗筷。他以前从未做过这些，此刻像是无师自通。</p> <p>院外窸窸窣窣的，零零散散围着一些村民，一边观察院里的动静，一边和同伴窃窃私语。</p> <p>杨戬有些不耐烦。</p> <p>“他们怎么看我俩跟看猴似的？”</p> <p>寸心笑了笑，眼皮不抬地回应道：“寡妇门前是非多，真君大人不知道么？”</p> <p>这是寒碜他呢，岂有此理。</p> <p>杨戬冷下脸，抹布一甩，预备出去发一火大的。</p> <p>正要发作，院外传来敲门声，杨戬警惕地在门缝里查探一番，才将缝隙拉得舒展。</p> <p>平凡普通的青年樵夫，五官里没有能让人记住的特征，对谁都是一张憨厚朴实的笑脸。</p> <p>他笑着向杨戬拱手，意思是麻烦借过。</p> <p>杨戬一头雾水地侧过身，看着樵夫将背后一捆半人高的干柴卸置门口，伸脑袋对院里的敖寸心招呼道：“龙姑娘，我给你送柴，天不亮去山上捡的！”</p> <p>“有劳秋实大哥，要付多少钱啊？”</p> <p>“不要钱……”</p> <p>说这话时，那汉子神态扭捏起来，常年外出做工晒得皮肤黑红黑红的，直往外冒傻气。</p> <p>寸心推辞道：“你也不容易，这怎么好意思呢？”</p> <p>“我心甘情愿的。”</p> <p>唉，又来了。</p> <p>敖寸心力竭地展开竹简，盖在脸上，妄图把自己藏起来。</p> <p>当寡妇真难……</p> <p>她努力调整心情，想出面与人解释清楚，下一秒，却被人按住肩膀不得动弹。</p> <p>竹简落下，杨戬与她四目相对。</p> <p>清晨的尴尬两人记忆深刻，无法在脑海里抹去，他们一对视，就会心跳加速血液升温。</p> <p>杨戬仔细端详寸心，忍不住抬手在她泛着粉色的鼻尖轻轻刮了一下。</p> <p>“不想做的事别做。”</p> <p>寸心愣住，心里某个地方松了一块，对他这般跃矩的举动，第一次没有表现出抗拒。</p> <p>杨戬放开她，拿着银票在篱笆外到处撒，见人就发，再把那捆干柴重新搬了出去。</p> <p>“作为夫君，谢过各位乡邻照看吾妻，还请大家就此散了，无事不要再来打搅。”</p> <p>软硬兼施，这个人倒挺有意思。</p> <p>寸心对他有了一些改观。</p> <p>既然赶都赶不走，就留待观察吧。</p> <h2 id="_5"><a href="#_5" class="header-anchor">#</a> 5</h2> <p>“呵，秋实大哥。”</p> <p>杨戬举起镰刀朝面前的木头重重挥了下去，手起刀落，木头利落地碎成好几瓣，他又恶狠狠重复念叨一句。“……秋实大哥。”</p> <p>寸心手上端的茶杯随他每劈刀一次，跟着震动一次，茶香溢在桌子上。</p> <p>“你没事吧？”</p> <p>杨戬扭头看她，目光如电。“你也这样叫我一次。”</p> <p>合着她就不该问。</p> <p>寸心脸上堆笑，走到他身边，夹着嗓子道：“杨大哥，杨戬哥哥，杨相公，郎君……满意了吗？”</p> <p>她靠过来的瞬间，杨戬眼里的坚硬被融化了。他丢下镰刀，搂过寸心的腰肢，唇朝她的脖子凑过去，想更近一点，离梦境中的感觉更近一点。</p> <p>寸心一惊，慌乱地躲开他的索吻。</p> <p>本只是想顺毛驴，怎会这样……</p> <p>用力推，推不开，热热的鼻息打在她头顶，她不敢直视杨戬眸光沉沉，他就那般毫不避讳地盯在她身上，眼里是汹涌的欲念和占有。</p> <p>寸心怯声道：“……你别过分。”</p> <p>“我是你夫君，不算过分。”</p> <p>成亲了一直不让碰，才叫过分。</p> <p>“我有孩子了！”</p> <p>“我问过，说可以。”</p> <p>敖寸心瞪大眼睛看他。“杨戬，你是不是疯了？”</p> <p>“我想验证一件事。”</p> <p>杨戬不由分说捏起她的下巴，手段强硬，令她动弹不得。</p> <p>霸道的吻落下来，寸心怒目圆睁的反抗，他却闭上眼仔细感受。</p> <p>香香的，软软的，疼疼的。</p> <p>她在他嘴唇上狠狠咬了一口。</p> <p>皮肉破开，有血迹渗出来，尖锐的痛感和他梦里的旖旎缱绻不太一样。</p> <p>是哪个环节出错了？</p> <p>正疑惑的功夫，敖寸心悄然抽开束缚，给了他一巴掌。</p> <p>……</p> <p>宁静乡村的日常，大抵没什么特别。</p> <p>晨鸡报晓，杨戬要赶去市集买新鲜的瓜果蔬菜，回来等寸心起床洗漱，一起吃饭。之后她会看书，竹简扔的到处都是。偶尔闲聊，都是她嘴馋，要吃这个要吃那个，可是他哪有这种天赋，灶台弄的像灾难现场，墙面熏得黑漆漆。</p> <p>隔三差五还要去散步，寸心月份越来越大了，脚步虚浮，需要杨戬这个跟班牵着她，陪她逛街。</p> <p>路人纷纷向他们投来艳羡的目光，可只有杨戬自己知道，他和三公主的关系止步在不即不离。一次冒进，造成再也没有亲密接触的资格，她防着他，就跟防贼似的。</p> <p>杨戬真不明白，他都放下了，为什么寸心对他还是满身戒备，从不与他交心。</p> <p>也许她的心早就给了之前的男人，迫于压力才勉强履行婚约。</p> <p>不对不对，不喜欢还要嫁，岂不是很傻……他自我否定。</p> <p>感情不能勉强，但三公主既然已经是他的妻子，他就不得不又争又抢。</p> <p>……</p> <p>夜里还是如之前一样，寸心睡房里，杨戬只能在屋檐下的竹席小憩。</p> <p>十月的天，晚上冷风嗖嗖，某人竟每日都要去屋后头的井边冲凉水澡，凉水整桶整桶地往脑袋上浇。</p> <p>有次寸心无意透过窗户撞见。</p> <p>月色洒落水面波光粼粼，杨戬头发湿漉漉的，上身赤裸，衣服拧成麻花随意地系在腰间，水滴顺着紧实的肌肉线条滑落，形成点点晶莹。</p> <p>颀身玉立，宽肩窄腰，骨肉匀停。</p> <p>身材倒是不错……寸心暗暗点评一番，咽了咽口水。</p> <p>第二天一早，她对杨戬严厉禁止这种不道德行为，说影响她休息。</p> <p>杨戬感到非常无辜。</p> <p>谁影响谁啊？</p> <p>……</p> <p>寸心肚子又大一圈了。</p> <p>她开始变得身材焦虑，每次更衣，裙子换了一件又一件，企图把肚子藏起来。</p> <p>她总是问杨戬。“我有没有变丑？”</p> <p>“好看着呢。”他如实回答。</p> <p>她说：“你骗人。”</p> <p>杨戬不想说话了，她生气，拿笔丢他，一不小心踩到宽大的衣摆，差点滑了一跤。</p> <p>这么冒失，叫人怎么放心。</p> <p>杨戬扶着她，一脸真诚地说：“我还是睡你房里吧，晚上有个照应。”</p> <p>寸心心道，你最好没想别的。</p> <p>可是放杨戬进屋以后，他冲澡的次数更勤了。以前一晚一次，现在一晚两次。</p> <p>她不记得他是怎么从打地铺，渐渐一步步地爬上了她的床。反正她的底线是，杨戬若敢对她动手，她就把他那玩意拔下来。</p> <p>只是后来冲澡也不管用。</p> <p>入冬了，杨戬说怕她着凉，两个人要盖一个被窝。</p> <p>寸心说：“都是神仙，冷什么。”</p> <p>“孩子冷。”</p> <p>脸皮真够厚的，真受不了。</p> <p>有些话寸心不想说，可事情发展到眼下这个地步，再不点出矛盾，某人就该哄着她，向她承诺只是蹭蹭不进去。</p> <p>“这么关心，孩子是你的吗？”</p> <p>这话委实煞风景。</p> <p>空气里暧昧的氛围冷却下来，黑暗中寸心看不清杨戬此刻脸上是怎样的表情。可她还清楚记得，新婚时他曾大发雷霆，骂她的话，一个字都不敢忘。</p> <p>其实不应该点破的，最起码不是以这种伤人的方式。</p> <p>他已经做的够好了，连日来的悉心照顾，替她解围，近乎百依百顺，也没强迫过她，算得上是个正人君子。</p> <p>这一切寸心统统看在眼里。</p> <p>最后一次，就当是试探，或是了断，她想看清楚他的心。</p> <p>……</p> <p>杨戬沉默良久，叹息一声，</p> <p>他认命了。</p> <p>“也可以是我的孩子。”</p> <p>这在寸心听来，比任何海誓山盟的情话都重。</p> <h2 id="_6"><a href="#_6" class="header-anchor">#</a> 6</h2> <p>寸心点燃床边烛台，灯罩仔细罩好。</p> <p>小小的房间变得亮堂堂，她坐回杨戬身边， 笑容甜美地拉着他的手臂，将他的掌心放置自己隆起的小腹上，眼角眉梢里含羞带怯。</p> <p>杨戬敏锐察觉到三公主对他态度有所好转，配合地贴上去，从背后将她一整个圈进怀里，下巴搁在她肩头。</p> <p>好香啊，把人弄得晕乎乎的，她说的什么，他都听的心不在焉。</p> <p>“你跟孩子好好认识一下。”</p> <p>寸心认为这是头等要紧事，某个榆木脑袋还在跟外面的假想敌较劲呢，希望这种方式能激发一下他尚未觉醒的父爱吧。</p> <p>杨戬的手僵着，像拗不过弯的假肢，十分不自在。</p> <p>他跟这小人儿实在不熟，要怎么认识，先自我介绍一下？</p> <p>他酝酿了许久，清清嗓子严肃道：“咳咳……小屁孩，听好了啊，吾乃昭惠显圣显圣二郎真君，家在蜀中，在天庭封了个王位，听调不听宣，平日呢，也就巡视地盘养养兵什么的。我给你当爹你就偷着乐吧，在里边乖一点，要是敢让你娘受罪，把你屁股打烂。”</p> <p>敖寸心哭笑不得，冲杨戬胸口给了一拳。“你能不能好好说，哪有这样吓小孩的！”</p> <p>“不是吓他，是提前警告。”</p> <p>杨戬溺在寸心的颈窝里，合上眼睛，表情如痴如醉。</p> <p>“对我来说你是最重要的，所以你生的孩子，才会跟着变得重要。”</p> <p>说话可真好听，跟小鸟唱歌似的。</p> <p>脖子上痒痒的，寸心缩了缩身子，架不住脖颈吻痕遍布，酥酥麻麻的触感使她起了一身鸡皮疙瘩，整个人被潜移默化一点点推平，衣襟上绑的绳结一个个被解散。</p> <p>要被吃掉了么……</p> <p>她不甘心，一双玉臂勾上杨戬的肩膀，打断他缠绵的攻势，就这样红着眼眶看着他，楚楚可怜的模样。</p> <p>“夫君，放了我吧，身子沉着呢。”</p> <p>成亲到现在，几个月来安分守礼，眼下箭在弦上，放不了一点。</p> <p>杨戬温柔却坚定地，握起寸心两只手臂交叠起来，按住，不让她反抗。</p> <p>“从你嫁我的那晚开始，到现在，我没有睡过一个好觉……我没办法，我太想了……”</p> <p>话音带着粗重的喘息，杨戬把脑袋埋在寸心起伏不定的胸口，仔细嗅着，像找食物的小狗一样。</p> <p>他倒是没有霸王硬上弓地强行把她办了，可是手一刻不闲，伸进里衣游移，各处肌肤被他像蛇信子一样的亲吻留下湿润的印记，腿间被一个硬邦邦的东西抵着，硌得人难受。</p> <p>长夜漫漫，叫她怎么睡得着。</p> <p>寸心能体会杨戬这些日子的煎熬了，软磨硬泡之下退了一步，道：“我帮你用手吧。”</p> <p>杨戬将头埋的更深了，为自己的龌龊感到羞愧。平日的他看起来很正常，甚至在外人眼里有些冷淡，只有他自己清楚，正经的外表下其实脑子里装的都是废料。</p> <p>“我用了，出不来。”</p> <p>寸心沉默了。</p> <p>她不敢想象这个变态每天背着她的时候都在干什么。</p> <p>……</p> <p>窗外残月未沉，星星渐稀，晨露清寒，远村偶有鸡鸣犬吠。</p> <p>已经寅时了，再不睡，天就要亮了。</p> <p>敖寸心和枕边人对抗了一夜，她如今已是重身之人，可没有那么好的精力同杨戬打持久消耗。</p> <p>她无可奈何地摊开四肢，“大”字一样将自己铺开来，神情麻木地向他叮嘱。</p> <p>“来吧，动作轻点，别压着我。”</p> <p>得到允许，杨戬窜过来，床板跟着晃动。</p> <p>……</p> <p>蒙蒙光的床帐里，寸心只能看见杨戬低着头，不发一语，一下一下往她身上撞。</p> <p>某人的做饭风格和他本人一样，缄默少言，想法都压在心底，动作重回往复，只能通过交错间的喘息，和他肌肉紧绷时传出的汗意，证明他其实对床笫之事乐此不疲，一身力气使不完。</p> <p>寸心被泪水糊住眼睛，紧咬着下唇，第三次向他求饶。</p> <p>“够了…真的，够了……”</p> <p>再继续下去，她怕出事。</p> <p>杨戬掐着寸心双腿，心中恋恋不舍，声音沙哑地说道：“你叫两声。”</p> <p>为什么要叫，那多丢脸。</p> <p>寸心不想配合，他报复地用力更猛。</p> <p>这人真是恶劣……</p> <p>她被迫地乱喊一通，娇喘声，抽噎声，乱七八糟。</p> <p>最后被注入的时候，寸心感觉宫口在跟着颤抖，身体不由自主产生痉挛，瞳孔失去聚焦。</p> <p>奇异的感觉，就像回到西海岸的那个傍晚，她第一次经历发情期。情愫催情，身不由己犯下大错，要是杨戬知道，可会怪她？</p> <p>……</p> <p>杨戬心满意足地躺在寸心身侧，手掌抚过她的小腹，确认胎儿没有异动，笑了笑，夸这孩子懂事。</p> <p>寸心试探着说：“我们在西海见过的，你有印象吗？”</p> <p>她原本打算把这个秘密一辈子烂在心里，现在看来，杨戬连别人的孩子都能接受，没道理不接受自己被迷奸这件小事才对。</p> <p>他不是爱惨了么，被喜欢的人睡了，就不算迷奸了吧……</p> <p>杨戬看着寸心一脸窘迫的模样，不禁噗嗤一下笑出声。</p> <p>“你是说我打上天庭，掉进西海那次？”</p> <p>寸心慌了，怕他想起，更怕他想起之后气急败坏，眼下的岁月静好转瞬成空。</p> <p>“是你救的我，对么？”杨戬继续说。</p> <p>这不可能的，寸心确信当时的杨戬已经不省人事了，不可能记得她。</p> <p>她不敢再听下去，满脑子都是那个最坏的结果，他一定会觉得她不要脸，要是声张出去，西海的脸面就要被她丢尽了！</p> <p>寸心慌乱地躲开杨戬的目光，艰难地支起身子，准备携球跑路。</p> <p>杨戬一把将她摁住，再三肯定道：“你别怕，我都知道了，别再丢下我……我愿意的！”</p> <p>“不管从前、现在、以后，只要你需要我，我都愿意。”</p> <p>寸心怔住，不可置信地望着他。“你什么时候知道的？”</p> <p>她又看到杨戬脸上那种别扭的表情，扭扭捏捏，像个大姑娘。</p> <p>“就刚刚，做的时候……”</p> <p>寸心感到天塌了。</p> <p>“你是真能忍啊，我不提，你就打算你一直不说是吧？”</p> <p>“我怕你尴尬。”</p> <p>“那真要谢谢你了！！”</p> <p>……</p> <p>一年后。</p> <p>灌江口杨家多添了一名女婴。</p> <p>几个月大的娃娃哭个不停，杨婵没有经验，手忙脚乱哄着，因睡眠不足而导致的黑眼圈搭拉着都快掉到地上。</p> <p>哮天犬提着尿介子过来，看她这副憔悴样子，吓了一跳。“三姐，你没事吧……怎么是你在带孩子，我主人呢？”</p> <p>等怀中婴儿睡下，杨婵才眼神空洞地转头，手指向大白天门窗紧闭的西厢房。</p> <p>“你来得正好，快去敲门，把他俩叫起来！这个家我是一天都不想呆了！！”</p> <p>狗子再笨，也知道那屋里睡的是哪两位。</p> <p>“我不敢……”</p> <p>杨婵恨铁不成钢地一把将孩子塞给哮天犬，怒气冲冲走过去拍门。</p> <p>“杨戬！你闺女可还没断奶呢！青天白日躲在里面干什么！我告诉你，谁的种谁带，姑娘我不伺候了！”</p> <p>“我叫你开门，听到没有！”</p> <p>“开门！！！”</p> <p>……</p> <p>整个西厢房被下了禁制，透不进来一点风。</p> <p>龙族的发情期是为了种族繁衍，身体发育完全后发情受孕，生下子嗣后修养一段时间，就会进入新的发情周期，没有外力可解。</p> <p>昨晚杨戬还缠着寸心，逼问她当初是怎么在他昏迷的时候主动的，要她再示范一次。</p> <p>然后就被赶去书房。</p> <p>今天已经做了七次，但似乎寸心的痛苦还没有退却，不敢想象她第一次发作时，不懂排解，可要怎样煎熬过来。</p> <p>他将桌上的几碗汤药一并饮下，抹了抹发白的唇角，步入帐中。</p> <p>……</p> <p>[全文完]</p> <h2 id="番外小剧场"><a href="#番外小剧场" class="header-anchor">#</a> 番外小剧场：</h2> <p>屏风内纱幔拂动，半透衣领滑落肩头，底下是肤若凝脂，圆润乳房轻颤，像如雪的冰酥酪触碰之下泛起涟漪。</p> <p>杨戬看着这一幕，口干舌燥地喉结翻滚。</p> <p>寸心看他进来，抱稳怀中婴儿连忙背过身，嗔道：“说了多少次，哺乳的时候不要随便进来！”</p> <p>夫人真是见外，孩子都跟他生了，还有什么是彼此之间没见过的？</p> <p>他小心翼翼地继续凑上前，神情谄媚。</p> <p>“三妹说她想侄女想的睡不着，要把惜儿抱过去陪睡。”</p> <p>杨惜杨惜，但是这个爹看起来似乎并没有掌上明珠般疼惜她。</p> <p>寸心整理衣襟，满脸质疑地望向他。“真的假的……你妹妹那么喜欢孩子，怎么不自己找人生一个？”</p> <p>杨戬忙回“真的真的”，手脚笨拙地接过杨惜，横抱竖抱怎么都不对，仿佛那是个易燃易爆炸的危险物品。</p> <p>孩子被成功骗了过去，躺在他怀里，天真地看着血缘上的爹咯咯笑，手指放进嘴里吮吸，在回味刚刚那一顿饱饭，小小的身体一抽一抽打着奶嗝。</p> <p>杨戬回望她，觉得这小东西真可爱，叫人爱不释手，只是他眼下他更爱她的娘亲。</p> <p>杨惜被带出去，不久后外头咋咋呼呼传来争吵声，寸心就知道是怎么一回事了。</p> <p>将孩子交接下去，杨戬快速进房，关好门窗，狗狗祟祟凑到屏风后，将脸埋进寸心的膝盖里，深深吸了一口气。</p> <p>真是拿小狗没有办法……</p> <p>寸心在他头顶摸摸，给他顺毛，每天哄完小的哄大的，身心疲惫，却又感到幸福。就是有些对不住杨婵妹子，她这个倒霉哥哥成日跟自己的女儿争宠，害的妹妹跟着遭殃。</p> <p>“对你妹妹好点吧。”寸心于心不忍。</p> <p>杨戬抬头看她，眼里亮晶晶的，不知在期待着什么。</p> <p>“我想你轻松一些。”</p> <p>“你不缠着我，我就轻松很多了……”</p> <p>杨戬听完很生气，不管不顾地将寸心推倒在床上，盯着她的胸口处发呆。她的胸脯照之前发育得更圆润饱满一些，交领上还残留着未干的奶渍，近距离能闻见阵阵乳香。</p> <p>他一手握去，竟然一掌不能包全，不禁发狠蹂躏一番，把手都印湿了。</p> <p>寸心一声娇呵，拍开他作案的爪子。</p> <p>“别闹……我困了，要睡觉。”</p> <p>杨戬充耳不闻，动作熟练地拆解她的腰绳。“你睡你的，我做我的。”</p> <p>行吧，随他去。</p> <p>寸心懒得纠结，睡眼沉沉地软下腰肢，任由自己被宽衣解带，里面的白色抹胸被扯开，密集的亲吻刺激肿胀的乳尖吐出白露点点。杨戬一嘴含了下来，连吸带咬，将溢出的汁水收集起来，吞进肚子。</p> <p>混蛋，孩子的口粮也抢！</p> <p>寸心猛地睁眼，对着压在身上的人连踢带打。</p> <p>“你别得寸进尺！”</p> <p>杨戬觉得很冤枉。</p> <p>他装出可怜巴巴的样子，相处这么久，总算知道三公主最是吃软不吃硬。“我只是觉得流的到处，很浪费。”</p> <p>“不用你管……”</p> <p>激动之间，一种酸溜溜的感觉从宫口升起，一路传到双乳，再到乳尖。乳房胀痛难以忍受，紧接着奶阵袭来，红肿如梅子一般的两粒吐出雨点般的乳汁。</p> <p>一滴、两滴、三滴……滴滴答答，忽然，成两股细细的喷射状，呲了杨戬满脸。</p> <p>完了，丢死龙了……现在和离还来得急吗？</p> <p>杨戬愣住，眼睛一眨不眨，脸上挂着湿意，震惊之余，嘴角笑容浮现，一点点变得扭曲。</p> <p>这是什么法术，好厉害的样子。</p> <p>寸心被他盯得发毛，第一万次想逃离杨府。</p></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/ALLforJianXin/allforjianxin.github.io/edit/master/docs/82.短篇-2026/090123.龙三公主的新婚惨案.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=%E5%B7%B2%E5%AE%8C%E7%BB%93" title="标签">#已完结</a><a href="/tags/?tag=%E5%BE%97%E5%AF%B8%E8%BF%9B%E5%B0%BA" title="标签">#得寸进尺</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/07, 20:39:53</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/597b2d/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">过生日真好</div></a> <a href="/pages/1339b3/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">鹊桥仙</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
