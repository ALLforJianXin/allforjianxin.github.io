mED1VQt6aISHVymXZ/B2aCtIG8AI8xfobj2d3en1wWVhOeHELKmLQ1s211s88comkv4UCwWyF787mJdYXtNfhKAXVqnKTq8QZvGAGGOfaTo5pGZ/PwbUCr5+DPr/1J92JNHr9aOl/F3iI5+O1nfybsGxoimvZ3ViWSluDITw3P37mypheDIPY0tw7+O/5ApbkYw+zpfaUVu32Pi98+defdUhEpZkRFq0aqyNh9FuL9hpYbEm6iwi0z2REd09ZmyENEbuhjDWzKvZXTqKYaBIr3tt5kuPtQBZFvEUwHt60vfCNu41XsksH9Ij1BMMz1Y0OOunHNShFIP5868g5zeXmuLwL9T4b6Q2+KejgAAAABJRU5ErkJggg==">云蒙山事件考<!----></h1> <!----> <div class="theme-vdoing-content content__default"><p>今天在外面手里只有手机有点儿无聊，就来跟大家聊聊宝前剧里的一个小剧情点——“云蒙山事件”。<br>
说小是因为这整件事从开始到结束只占了不到六分钟剧情（30集24分老杨院中舞刀开始到29分带着梅山康老大直老六收工回家），而我起意想要唠唠这个事儿就是因为这事件发生的地点，云蒙山。</p> <p>现如今的云蒙山有说法说是指京郊密云那片儿的一座山，考虑到历史上还有个可能更出名些的“云梦山”，并且后面剧情中字幕称玉帝大怒降暴雨的是“楠郡”实际上我瞎考证下来很可能是历史上所称“南郡”（具体考证过程如果有机会开楠郡主题贴的话再细说），因此我觉得写同人时对剧中所称出现妖怪的这座山处理成“云蒙山”还是“云梦山”都是讲得通的。但是，我又要但是了，这个“云梦山”不管现在是河北邢台和河南鹤壁争不争，古云“云梦山”所指是太行山脉的一部分是没跑的，太行山脉最南端也就在现在的河南鹤壁附近，尚在河南省靠北的部分，那是绝对不算在蜀地的，也就是说这座闹妖精的山肯定是不在小杨川主封地内的！如果小杨真的带兵去降妖了，他的玉帝舅舅想拿他还真的是十分非常滴名正言顺、师出有名。顺便再提一嘴古风文里常用的“云梦大泽”，云梦泽是指曾经分布在江汉平原上的许许多多湖泊组成的湖泊群，先秦之前规模较大，到唐宋时期已经解体成小湖泊群了。</p> <p>上面👆一大段是我最开始在意“云蒙山”去四处搜索得到的感慨，因为我懒癌晚期，一直拖着没唠，后来我才知道，是天意如此，是没到时机（装神婆试图掩盖自己鸽鸽鸽的本质好孩子不要学啊）。后来我又起意想研究研究封神演义，我起意想做个封神地图（别问我地图现在在哪里，别让我尴尬），那肯定是从第一回开始撸嘛。</p> <p>第一回《纣王女娲宫进香》，里头说，“（去女娲宫）驾出朝歌南门”。</p> <p>嗯我们先在地图上找到朝歌：百科说“朝歌位于今河南鹤壁市淇县”，先找到淇县，在地图上扒拉扒拉，看我看到了啥——朝歌寨——就是这儿了吧？（见图1）（瞎考据原则之地名大概率是有历史沿革的）好滴那朝歌位置定在这儿了，我们再出朝歌南门看看——哎？这山？哎？这儿有个上神庙？让我们放大康康（图2）。</p> <p>图1：
<img src="/img/cho/YunMeng01.jpg" alt="图1">
图2：
<img src="/img/cho/YunMeng02.jpg" alt="图2"></p> <p>嗯🌝好像也不用我说啥了，大家看图说话吧就。</p> <p>之前考据贴里我排了云蒙山事件就在封神战后头没多久，才十来年，不管按宝莲灯说法还是按同人常用的封神战后女娲娘娘隐世的设定，那这上神庙没了真神，会不会被妖魔窃据呀？那女娲娘娘对他杨家兄妹那么好（送婵儿宝莲灯送老杨山河社稷图等等），老杨他去帮前辈打扫打扫卫生，很自然吧？</p> <p>意识流脑洞开到哪儿写到哪儿的瞎考据，就不强行总结了，大家就看着乐呵乐呵吧，有空的话来评论里跟我唠嗑啊～</p></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/ALLforJianXin/allforjianxin.github.io/edit/master/docs/97.嗑学/90.扩展考据/01.云蒙山事件考.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=%E5%AE%9D%E8%8E%B2%E7%81%AF%E5%89%8D%E4%BC%A0" title="标签">#宝莲灯前传</a><a href="/tags/?tag=%E8%80%83%E6%8D%AE" title="标签">#考据</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/25, 21:49:45</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/pages/24113c/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">宝莲灯前传不严谨时间线考据</div></a> <a href="/pages/467e1e/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">宝前、封神、西游对照年表</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
