然后最后，又名《三公主的赤色龙凤肚兜还挂在那狂徒的腰上》，哈哈哈🤣<br>
以下正文。</p> <p>开殿门把个气喘如牛声似风箱的司法天神迎进来，不待寸心吩咐侍女们已经轻车熟路各自去忙，寸心极力撑住男人宽大的胸膛半搂半拖带他挪进内室，一层层撩开珠帘纱帐，将人扶上床，又一层层放下纱帐珠帘，然后立马合身扑过去兜头盖脸将人紧紧搂进怀里。杨戬嗅到第一口龙女胸口的芬芳时，珠帘的散碎声还在晃。<br>
等侍女们再回前室在条案上摆满各色簋盨簠敦豆，又再次退下顺带掩上殿门时，杨戬的呼吸已经显见得平稳许多了。<br>
“还疼吗？”三公主轻声垂询。<br>
其实还是痛的，离开她身边的每一刻呼吸都带着伤，离得越久伤势越重，终至每一口吸进去的没有她味道的空气都能划伤他的气道，每一口呼出来又雪上加霜。<br>
他舍不得公主温暖芬芳的怀抱，可又不愿她因为担心他而太过紧张，想了一会儿，杨二郎还是回答：“好多了。”<br>
往常公主下一句该说“那要不要起来先吃点东西？”然后由他摇头拒绝，然后她再说“好，那你饿了自己跟我说”云云。今天公主却跳过了这些繁文缛节，公主却又更抱紧他了一些，公主说：“那就好。”公主温柔的手又温柔地揉着他的后颈和头发，说：“那就好，那我再抱你一会儿。我再抱会儿二郎。”杨戬立刻也更紧紧地抱回去，把头更深深埋入公主怀中，猛吸一大口，然后一边缓缓呼气，一边平复自己因为惊喜而狂跳不止的心脏。<br>
杨戬贪心的小动作惹得公主哑然失笑，心下一片柔软，愈发怜他爱他，揉揉捏捏他卷曲的头发，仍是不足以表达心里满得要溢出来的爱意，干脆低下头，在他发顶轻轻吻了一下。</p> <p>尤记那时，杨戬一身血污气喘吁吁闯进来，彼时寸心才被天廷夺了公主封号，却又被父母驳回了好歹去掉公主寝殿匾额的请求，正枯坐园中思索以后出不了西海该去哪里玩，才想到西海就挺大的往年碍于本海人不玩本海景不好意思逛，听说有个沉没的城市群，还有沉船遗址都是热门景点……才想到这里侍儿突然来报：“司法天神来了。”<br>
寸心内心疯狂尖叫她是真的被吓到了，不是说为免再连累西海，他无事不会随便来找她的吗？都给了他小海螺了有什么事不能传音说还非要跑上门来？<br>
心里是这样想着但脚下也无丝毫耽搁，从听到回报起就从花凳上弹起身来往外奔，想到这里时正好见到杨戬，见到他并不似侍儿所说的“司法天神”模样，而只是个浑身血污气喘吁吁的杨家二郎，霎时什么乱七八糟的也顾不上再多想，三步并作两步奔到他身前把人扶住，心里只有一个念头：“要救他。”<br>
那人软软倚在她怀中，气息奄奄，入的气还没有出的气多，就仿佛她第一次在西海里捞到他时一模一样。连忙口对口渡过几口龙息真气，吊起命来，再喊侍儿们去请龙王海医，又自己把他扛进屋里。<br>
那一天的西海上上下下忙作一团什么千年万年的灵丹妙药全搜罗出来往他嘴里塞，却只见他状况好好坏坏，后来咂摸出味儿来，每次都是她亲自去给他煎药时病情恶化的，于是她把所有活计都交代给其他人，她只片刻不离守在他身边，他竟真的就这么好起来了。<br>
人醒过来的第一句话竟是：“不是我的血。”<br>
废话，你昏着的这些时候上上下下都帮你查遍了，是不是你的血还能不知道吗？是是是司法天神神功盖世杀得妖怪魔兽丢盔弃甲片甲不留，沾了满身血来还得给你洗，还污了公主殿好几床被褥……<br>
寸心正数落着，侍儿又来传话说龙王请公主叙话。无非就是要谈这位不速之客司法天神醒了之后该如何处置，可他已经醒了，还听到了。寸心只能先亲一亲安抚住他，然后去向父亲请求好歹等人好全了，再回来时只见那人缩在她大床最内侧的角落里，只一句话：“我杀干净了，没留活口。”<br>
唉，意思不就是说现在没人知道你是来西海了吗？求人收留时说话不能再软一点吗？<br>
真是拿你没办法。</p> <p>据杨戬自己的说法，只要在下一次天廷朝会之前赶回去就行，所以他就这么昧在西海住了下来，病渐渐养好话也就渐渐多起来，不问不打紧，一问才知道他落下这般毛病竟已至少几百年了。<br>
“从上天当那劳什子官起就这样？”这是三公主问的。<br>
“嗯……大约是吧。”这是二郎神答的。<br>
三公主又问：“那你之前三百多年都是怎么熬过来的？”<br>
二郎神似是答非所问又似是答即所问：“我把卧室封起来了，你的味道可以散得慢一些。还有你留下的鲛纱和衣饰……”<br>
三公主恨不得立刻堵上他那张嘴。</p> <p>有道是天上一天凡间一年，那一次杨戬在西海一住就是好几个月。他夫妻原就是被天廷生生拆散的，一向的郎有情妾有意，旧情未熄见着点儿火星自然旋即就复燃了，兼之二郎神留宿期间就睡在三公主床上，为他养病计二人更是行走坐卧都不稍离，于是擦枪走火在所难免，就像现在这样，三公主觉得自己才走神片刻，怎么那人竟已经欺身上来亲了个全乎，还开始动手动脚要剥她的衣衫？<br>
“杨戬？”<br>
“嗯……寸心……”<br>
寸心试着推他胸口，推不开。<br>
他总是这样，遇到自己不想听的最会装傻，她明明是有话要问他，他偏就当成浓情蜜意时的呢喃，把她的问题全都吞吃下去。<br>
“杨戬！”寸心试着加了几分薄怒。<br>
“嗯。寸心，我在呢。小神在。”那人却也只当是调情的轻嗔，最会蹬鼻子上脸。<br>
“杨戬！！！”三公主这下真的怒了，猛一用力翻身上神，骑在了司法天神腰上！<br>
可惜还是嘴晚了一步，被人轻轻就带偏了方向：“好，今天换寸心来。”<br>
这下子三公主真的把自己原本想要问些什么忘得一干二净了，却又骑神难下。愣怔片刻心一横，输人不能输阵，遂决定上都上了那今天自然要干到底也让他不能小瞧了龙族的厉害。</p> <p>那边杨戬仰望着妻子睥睨天下般的脸庞，细细品味着纵容她撕碎自己衣衫的快爽。<br>
她纤秾合度的身体还隐在轻纱之下，胸前双峰已从他之前剥开的缝隙里破衣而出遍撒春光。她的手指落在他喉口的凸起处像坏心眼儿的小猫爪子样故意踩几下，继而一路转下去，压得他又痛又爽，撩得他血脉贲张。<br>
“寸心……”<br>
杨二郎忍不住扭腰顶胯迎奉而上，可三公主且还不想笑纳，发蛮力狠狠往下一坐，却正好隔着衣料也鱼吻了蚌。二郎胯下金刚杵是愈压愈强，弹动着向三公主频献殷勤，三公主仍不紧不慢，削葱般的十指拂过他的下巴他的脸庞，再拂过锁骨和胸膛。<br>
十指继续向下拂过腰侧，腹肌的块垒忽而愈加分明，小腹也硬梆梆。<br>
寸心退后一段同时起身一些，那被压到极限的肉棒弹起来又回敲在她的小腹上。龙女登时腹心一热，待褪去下裳热流早已下注，扶龙入港又润又滑，杨戬几乎没有感到任何阻力，只觉得四面八方被紧紧包裹住，肉刀顺滑地破开肉壁，一口气撞上尽头的盾墙。</p> <p>“寸心！”<br>
他被她吮得头皮发麻爽得快要爆炸，她也被突如其来的禁地深入激得神志出现了片刻空档。<br>
空档间爱汁情液已经又流出了许多，再骑起来一下下颠簸间都啪啪作响。</p> <p>她居高临下垂眸凝视他，他会好奇她当初在西海中救起他时是不是也这样美丽又强大。<br>
她紧紧缠握着榨取着他，他毫不怀疑他会永远向她奉献竭尽所能毫无保留，只要她再看着他。</p> <p>她骑在他身上纵横驰骋，牵起他双手十指紧扣像驭着缰绳。她坐在他柱上套弄不休，浅浅深深轻重缓急都是对他的施予对他的赐福，都是她对他的虔诚的奖赏。<br>
然后她的信徒将自己的身心全都奉上，他顶着女神的威压迎难而上，顶进她腹心最深处，蓬勃又深重地绽放。</p> <p>再然后，释放后的温存时光最是温馨可爱，他抱着她，她伏在他怀里，他一下下轻吻她的额头，腼腆地笑着请求：“寸心，我饿了。”<br>
“真是拿你没办法。”三公主笑着戳戳他的酒窝，把自己拔起来时吐出去的那一下轻微“叭”声，两个人都且羞且爱煞。</p> <p>三公主脚有些软，落下地停了一会儿，他忙探身扶住她。她走去拿盛肉的豆盒这一段路也走得比往常久且长。拿回来先将豆盒放在床头边小几上，她扶他起来拉几个软枕给他靠好，他又求起了新花样：“寸心还坐上来，寸心坐上来喂我。”<br>
三公主柳眉瞬竖捏起他腰间软肉就是左拧一圈右拧又一圈，不过拧完后还是爬了上来，她也很想继续被他填满的饱胀。<br>
于是上边喂着下边也喂着，上边喂饱了下面继续吃继续爽，继续颠动继续流淌。</p> <p>就这么“养病”几日，昏天黑地一场接一场，不知道他什么时候开始怎么就翻身在上？三公主又一次昏睡过去前还惦记着问他：“这次好了能坚持多久？”他只说：“坚持多久也会每一天都想念龙女娘娘。”<br>
她扁扁嘴说：“你竟这般想我？是想我这个人？还是想我的身子？”<br>
连忙赌咒发誓想人才会想身子，是爱煞了她才对她的身子迷恋不可自拔，是爱她才生出了欲望。<br>
再逗她一下：“而且明明就是想龙。”<br>
三公主捏起粉拳轻轻锤上他胸口，嘴上说他“就会贫嘴”，心里却早是信了的，她一向信他，他们已经纠缠了两千年了，且还将继续纠缠下去，到永远，久久长长。</p> <p>三公主沉入了香甜梦乡，二郎神望着她甜美的睡颜思绪还在徜徉。<br>
她以为是相思痛也好，她就会一直这样怜他爱他，一直这样。她以为他是相思而痛，以为是从她离了灌口开始，是他在暗无天日的重天之上日渐加深，终至到了要靠定时吸龙才能过得下去的地步。她以为这样就会允了他办完改换天条的大事后就辞官归隐来西海做个逍遥女婿，他就再不用跟她分开了，想到这里杨戬几乎乐得要笑出声来，怕吵醒了公主又生生压下。<br>
杨戬俯下身在熟睡的公主脸上印下一吻。<br>
只有他自己知道那是比相思还要深还要久还要更加顽固的东西，打她从西海里救起他时就有了，只是从前的一千多年里他从未离她那么远那么久过。<br>
这完全不是什么毛病，这是荣耀这是勋章，像雏鸟印随像精神的刻印，这不仅仅是相思的明证，更是能标志他是彻彻底底属于她的印记，是他刻在骨中融在血里，无可磨灭的力量。<br>
也曾想过若不是寸心公主会怎样，每次都惊出一身冷汗。<br>
还好。<br>
还好。<br>
还好是她，是值得他爱也爱他的姑娘。<br>
杨戬在熟睡的公主脸上又印下一吻。<br>
何其有幸。<br>
他何其有幸。<br>
他杨戬就是这全三界最幸运最幸福的人，没有人可以和他争抢。</p> <p>就这么几天司法天神在西海里养病，东海里的会议从他离开八太子的湖中别宫起，开到半天前才有了主张，到底是龙后有见识：“咱西海的三闺女跟他结缡千年，最是懂他，就去找她讨个说法。”<br>
敖广顺水路到了西海见到弟弟却被左右搪塞阻挠，恼极了一边往三公主殿闯一边喊：“我见我三侄女怎么了？三侄女受了委屈回娘家我这个大伯父来给她撑腰怎么了？”</p> <p>杨戬修炼出的耳聪目明在这时就派上了大用场，瞧一瞧公主还在熟睡，再亲一亲她柔软的唇瓣，起身随便扯一件外套一条锦带束上，锦带上还缠着三公主的龙凤肚兜也不必解下，随手往腰侧再掖一掖，留出图案完完整整。<br>
开殿门拜龙王。<br>
“伯父大人、岳父大人，小婿见礼了。<br>
“寸心还在睡着，我们到旁边借一步说话？”</p> <p>对面老哥俩面面相觑用表情打起嘴仗。<br>
敖广：你怎么不早说！<br>
敖闰：你给我时间说了嘛你硬生生要往这儿闯！</p> <p>寸心醒过来时见杨戬从外面回来，问他：“你去哪儿了？”<br>
“去吃了点东西。让我再抱抱寸心。”<br>
三公主眼尖瞧见了他腰里：“哎呀你怎么把我的肚兜系在腰上！”<br>
那人最会蹬鼻子上脸，不仅不羞，还要“请公主把这件赏了我吧，我带回去，做个念想。”</p></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/ALLforJianXin/allforjianxin.github.io/edit/master/docs/82.短篇-2026/080619.相思痛.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <div class="tags"><a href="/tags/?tag=%E7%9F%AD%E7%AF%87" title="标签">#短篇</a><a href="/tags/?tag=%E5%BE%97%E5%AF%B8%E8%BF%9B%E5%B0%BA" title="标签">#得寸进尺</a></div> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/25, 21:49:45</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><!----> <a href="/pages/597b2d/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">过生日真好</div></a></div> <div class="page-nav"><p class="inner"><!----> <span class="next"><a href="/pages/597b2d/">过生日真好</a>→
