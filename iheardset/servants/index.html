发冠和玉剑-后景-或梳妆台半开的抽屉中-露出龙女发饰"><a href="#羁绊礼装-放在梳妆台的婚服发冠和玉剑-后景-或梳妆台半开的抽屉中-露出龙女发饰" class="header-anchor">#</a> 羁绊礼装：放在梳妆台的婚服发冠和玉剑，后景（或梳妆台半开的抽屉中）露出龙女发饰</h4> <h4 id="灵衣-婚服-2"><a href="#灵衣-婚服-2" class="header-anchor">#</a> 灵衣：婚服</h4> <hr> <h4 id="alter-黑化杨"><a href="#alter-黑化杨" class="header-anchor">#</a> Alter：黑化杨</h4> <p>职阶未定</p> <hr> <h4 id="foreigner-触手杨"><a href="#foreigner-触手杨" class="header-anchor">#</a> Foreigner：触手杨</h4> <p>某个没有敖寸心的世界线，掉入海中的杨戬Lily死去后执念所化（与水鬼或其他东西<span class="heimu">克总</span>融合）</p> <hr> <h4 id="其他角色"><a href="#其他角色" class="header-anchor">#</a> 其他角色</h4> <p>Rider：玉帝</p> <p>Assassin：王母</p></div></div> <!----> <div class="page-edit"><div class="edit-link"><a href="https://github.com/ALLforJianXin/allforjianxin.github.io/edit/master/docs/《我闻》设定集/91.境界记录带.md" target="_blank" rel="noopener noreferrer">编辑</a> <span><svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" x="0px" y="0px" viewBox="0 0 100 100" width="15" height="15" class="icon outbound"><path fill="currentColor" d="M18.8,85.1h56l0,0c2.2,0,4-1.8,4-4v-32h-8v28h-48v-48h28v-8h-32l0,0c-2.2,0-4,1.8-4,4v56C14.8,83.3,16.6,85.1,18.8,85.1z"></path> <polygon fill="currentColor" points="45.7,48.7 51.3,54.3 77.2,28.5 77.2,37.2 85.2,37.2 85.2,14.9 62.8,14.9 62.8,22.9 71.5,22.9"></polygon></svg> <span class="sr-only">(opens new window)</span></span></div> <!----> <div class="last-updated"><span class="prefix">上次更新:</span> <span class="time">2026/09/07, 20:39:53</span></div></div> <div class="page-nav-wapper"><div class="page-nav-centre-wrap"><a href="/iheardset/ending/" class="page-nav-centre page-nav-centre-prev"><div class="tooltip">ENDING</div></a> <a href="/iheardset/yangjiandemo/" class="page-nav-centre page-nav-centre-next"><div class="tooltip">司法天神</div></a></div> <div class="page-nav"><p class="inner"><span class="prev">
