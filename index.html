            昨夜西风
            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">鱼头</span> <span title="创建时间" class="iconfont icon-riqi">2019-05-26</span> <span title="分类" class="iconfont icon-wenjian"><a href="/categories/?category=%E9%B1%BC%E5%A4%B4">鱼头</a><a href="/categories/?category=%E7%9F%AD%E7%AF%87">短篇</a></span> <span title="标签" class="iconfont icon-biaoqian tags"><a href="/tags/?tag=%E7%9F%AD%E7%AF%87">短篇</a><a href="/tags/?tag=%E6%9C%89%E6%83%85%E4%BA%BA">有情人</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><h1 id="昨夜西风"><a class="header-anchor" href="#昨夜西风">#</a> 昨夜西风</h1>
<h2 id="上"><a class="header-anchor" href="#上">#</a> 上</h2>
<h3 id="【一·司法天神】"><a class="header-anchor" href="#【一·司法天神】">#</a> 【一·司法天神】</h3>
<p>司法天神埋首案牍已有些时日，本道天宪既出诸事便可落定，奈何在其位谋其政他仍是日日连轴转，刻下觉着喉头胸腔似有风过好些肉痒，他耐不住咳了几声。</p>
<p>“兄长且歇片刻，待用了药再瞧罢”华山圣母手持托盘亭亭立在案旁温声道。</p>
<p>神官见了摆手言道“不妨事，待我将手上这点西海章子看完，海属的事儿便算了了。”</p>
</div> <a href="/pages/b54dfb/" class="readmore iconfont icon-jiantou-you">阅读全文</a></div></div><div class="post card-box iconfont icon-zhiding"><div class="title-wrapper"><h2><a href="/pages/74fa18/">
            我执
            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">蓬蓬裙</span> <span title="创建时间" class="iconfont icon-riqi">2019-04-27</span> <span title="分类" class="iconfont icon-wenjian"><a href="/categories/?category=%E8%93%AC%E8%93%AC%E8%A3%99">蓬蓬裙</a><a href="/categories/?category=%E5%B7%B2%E5%AE%8C%E7%BB%93">已完结</a></span> <span title="标签" class="iconfont icon-biaoqian tags"><a href="/tags/?tag=%E5%B7%B2%E5%AE%8C%E7%BB%93">已完结</a><a href="/tags/?tag=%E7%A7%8B%E5%90%8D%E5%B1%B1">秋名山</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><h1 id="我执"><a class="header-anchor" href="#我执">#</a> 我执</h1>
<h2 id="_1"><a class="header-anchor" href="#_1">#</a> 1</h2>
<p>司法天神，他从一个卑鄙无耻、罔顾亲情的小人峰回路转到今日劳苦功高受众仙家连连称赞爱戴的仁德显圣，其间使了多少手段，恐怕只有他自己知道。</p>
<p>说是为天下众生，其实不过幌子，有时候入戏太深，连自己都快分不清到底是是为了私情还是公义，直到那天又在瑶池遇见她。</p>
</div> <a href="/pages/74fa18/" class="readmore iconfont icon-jiantou-you">阅读全文</a></div></div><div class="post card-box"><div class="title-wrapper"><h2><a href="/pages/1339b3/">
            鹊桥仙
            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">Cho</span> <span title="创建时间" class="iconfont icon-riqi">2026-09-02</span> <span title="分类" class="iconfont icon-wenjian"><a href="/categories/?category=Cho">Cho</a><a href="/categories/?category=%E7%9F%AD%E7%AF%87">短篇</a></span> <span title="标签" class="iconfont icon-biaoqian tags"><a href="/tags/?tag=%E7%9F%AD%E7%AF%87">短篇</a><a href="/tags/?tag=%E5%BE%97%E5%AF%B8%E8%BF%9B%E5%B0%BA">得寸进尺</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><h2 id="前情-《狎龙》"><a class="header-anchor" href="#前情-《狎龙》">#</a> 前情 <RouterLink to="/pages/97385a/">《狎龙》</RouterLink></h2>
<h2 id="前情-《真君醉酒逞豪强》"><a class="header-anchor" href="#前情-《真君醉酒逞豪强》">#</a> 前情 <RouterLink to="/pages/97385a/">《真君醉酒逞豪强》</RouterLink></h2>
<hr>
<p>几日前那郎君生辰，特特诓了小龙女到庙里，带她边游边逛一路上山，忽而迎面一间“龙王殿”，香烟缭绕已然是享了供奉，神龛下还挖出小池充作“龙宫”，亦颇见意趣和用心。后来至正殿，更见主神侧旁添立了章淑夫人神位并神像，神像眉眼分明就是照着她模样塑造。唬得个小龙女不胜惶恐，连连摆手：“这怎么当得起？”那郎君立刻抚扇俯身至她面前道：“温克令仪曰章，窈窕清湛曰淑，怎么，这称号寸心不喜欢？”</p>
</div> <a href="/pages/1339b3/" class="readmore iconfont icon-jiantou-you">阅读全文</a></div></div><div class="post card-box"><div class="title-wrapper"><h2><a href="/pages/9c43f3/">
            龙三公主的新婚惨案
            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">蓬蓬裙</span> <span title="创建时间" class="iconfont icon-riqi">2026-09-01</span> <span title="分类" class="iconfont icon-wenjian"><a href="/categories/?category=%E8%93%AC%E8%93%AC%E8%A3%99">蓬蓬裙</a><a href="/categories/?category=%E5%B7%B2%E5%AE%8C%E7%BB%93">已完结</a></span> <span title="标签" class="iconfont icon-biaoqian tags"><a href="/tags/?tag=%E5%B7%B2%E5%AE%8C%E7%BB%93">已完结</a><a href="/tags/?tag=%E5%BE%97%E5%AF%B8%E8%BF%9B%E5%B0%BA">得寸进尺</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><h2 id="_1"><a class="header-anchor" href="#_1">#</a> 1</h2>
<p>好热，海水都是烫的。</p>
<p>鲛纱帐下的人族少年宛若出尘，长睫紧闭，白衣和发丝被海风牵起，流风之回雪一般。</p>
<p>绝对是身体里的奇怪感觉在作祟，敖寸心自诩堂堂西海龙宫三公主，可不是爱犯花痴的龙，眼下却没道理地对他上了一层滤镜，认为再没有比这更好看的男人了。</p>
<p>救命之恩大过天，要不是她将这昏迷的小郎君从海里捞起来，小郎君就淹死了。</p>
<p>让他用身体报答，不过分吧？</p>
</div> <a href="/pages/9c43f3/" class="readmore iconfont icon-jiantou-you">阅读全文</a></div></div><div class="post card-box"><div class="title-wrapper"><h2><a href="/pages/597b2d/">
            过生日真好
            <!----></a></h2> <div class="article-info"><span title="作者" class="iconfont icon-touxiang">斑斑</span> <span title="创建时间" class="iconfont icon-riqi">2026-08-06</span> <span title="分类" class="iconfont icon-wenjian"><a href="/categories/?category=%E6%96%91%E6%96%91">斑斑</a><a href="/categories/?category=%E7%9F%AD%E7%AF%87">短篇</a></span> <span title="标签" class="iconfont icon-biaoqian tags"><a href="/tags/?tag=%E7%9F%AD%E7%AF%87">短篇</a><a href="/tags/?tag=%E5%BE%97%E5%AF%B8%E8%BF%9B%E5%B0%BA">得寸进尺</a></span></div></div> <div class="excerpt-wrapper"><div class="excerpt"><p>太阳出来了。<br>
杨戬坐起来拍拍衣角，朝卧室看了一会儿，不见动静，便把枕头提到客房，梳头发换衣裳，勉强打起精神，再看两眼卧室，还是没声响，只得皱一下眉毛叹两口气，推开大门自己出去。</p>
